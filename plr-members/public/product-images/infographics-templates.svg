    <text x="94" y="228" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Avg Monthly Revenue</text>
    <rect x="20" y="236" width="148" height="6" rx="3" fill="#EFF6FF"/>
    <rect x="20" y="236" width="140" height="6" rx="3" fill="#1A1A4E"/>
    <rect x="20" y="250" width="148" height="1" fill="#E5E7EB"/>

    <!-- Icon grid -->
    <text x="94" y="278" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Template Types</text>
    <rect x="16" y="288" width="72" height="44" rx="6" fill="#EFF6FF"/>
    <rect x="100" y="288" width="72" height="44" rx="6" fill="#EFF6FF"/>
    <text x="52" y="308" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">📊</text>
    <text x="52" y="322" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Statistics</text>
    <text x="136" y="308" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">🗺️</text>
    <text x="136" y="322" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Maps</text>
    <rect x="16" y="340" width="72" height="44" rx="6" fill="#EFF6FF"/>
    <rect x="100" y="340" width="72" height="44" rx="6" fill="#EFF6FF"/>
    <text x="52" y="360" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">📈</text>
    <text x="52" y="374" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Charts</text>
    <text x="136" y="360" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">🔄</text>
    <text x="136" y="374" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Process</text>
  </g>
</svg>
