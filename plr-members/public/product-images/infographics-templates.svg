    <text x="68" y="96" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Mar</text>
    <text x="116" y="96" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">Jun</text>
    <text x="164" y="96" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Sep</text>
    <text x="210" y="96" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Dec</text>

    <!-- Bar chart -->
