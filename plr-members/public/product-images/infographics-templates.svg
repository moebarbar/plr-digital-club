    <rect x="58" y="170" width="28" height="50" rx="3" fill="#1565C0" opacity="0.5" transform="rotate(180,72,145)"/>
    <rect x="96" y="170" width="28" height="40" rx="3" fill="#93C5FD" opacity="0.5" transform="rotate(180,110,150)"/>
    <rect x="134" y="170" width="28" height="65" rx="3" fill="#1565C0" opacity="0.6" transform="rotate(180,148,137)"/>
    <rect x="172" y="170" width="28" height="80" rx="3" fill="#ffffff" opacity="0.6" transform="rotate(180,186,130)"/>
