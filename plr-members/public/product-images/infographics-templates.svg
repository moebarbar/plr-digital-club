    <text x="36" y="157" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
    <text x="65" y="148" font-family="Arial,sans-serif" font-size="9" fill="#1A1A4E" font-weight="bold">Build Your Brand</text>
    <rect x="65" y="154" width="115" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="65" y="162" width="80" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="36" y="172" width="2" height="24" fill="#E5E7EB"/>

    <!-- Step 3 -->
    <circle cx="36" cy="214" r="18" fill="#1565C0" opacity="0.7"/>
    <text x="36" y="219" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
    <text x="65" y="210" font-family="Arial,sans-serif" font-size="9" fill="#1A1A4E" font-weight="bold">Create Content</text>
    <rect x="65" y="216" width="115" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="65" y="224" width="100" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="36" y="234" width="2" height="24" fill="#E5E7EB"/>

    <!-- Step 4 -->
    <circle cx="36" cy="276" r="18" fill="#1565C0" opacity="0.6"/>
    <text x="36" y="281" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
