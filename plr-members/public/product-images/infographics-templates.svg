    <text x="65" y="86" font-family="Arial,sans-serif" font-size="9" fill="#1A1A4E" font-weight="bold">Define Your Niche</text>
    <rect x="65" y="92" width="115" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="65" y="100" width="90" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="36" y="110" width="2" height="24" fill="#E5E7EB"/>

    <!-- Step 2 -->
