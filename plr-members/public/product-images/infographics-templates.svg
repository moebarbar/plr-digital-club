    <circle cx="68" cy="77" r="6" fill="#93C5FD"/>
    <circle cx="116" cy="77" r="6" fill="#ffffff"/>
    <circle cx="164" cy="77" r="6" fill="#93C5FD"/>
    <circle cx="210" cy="77" r="6" fill="#1565C0" stroke="#93C5FD" stroke-width="2"/>

