    <rect x="20" y="104" width="148" height="6" rx="3" fill="#EFF6FF"/>
    <rect x="20" y="104" width="129" height="6" rx="3" fill="#1565C0"/>
    <rect x="20" y="118" width="148" height="1" fill="#E5E7EB"/>

