    <text x="94" y="162" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Monthly Impressions</text>
    <rect x="20" y="170" width="148" height="6" rx="3" fill="#EFF6FF"/>
    <rect x="20" y="170" width="100" height="6" rx="3" fill="#93C5FD"/>
    <rect x="20" y="184" width="148" height="1" fill="#E5E7EB"/>

    <!-- Metric 3 -->
