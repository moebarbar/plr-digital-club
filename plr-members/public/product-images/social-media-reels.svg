    <text x="59" y="85" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">☀️</text>
    <text x="59" y="100" font-family="Georgia,serif" font-size="8" fill="#EFF6FF" text-anchor="middle" font-weight="bold">"Your only limit</text>
    <text x="59" y="111" font-family="Georgia,serif" font-size="8" fill="#93C5FD" text-anchor="middle">is your mind"</text>
    <!-- Bottom UI -->
