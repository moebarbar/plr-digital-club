    <rect x="16" y="58" width="100" height="60" rx="8" fill="#EFF6FF"/>
    <text x="66" y="82" font-family="Arial,sans-serif" font-size="22" fill="#1A1A4E" text-anchor="middle" font-weight="bold">9:16</text>
    <text x="66" y="96" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Vertical Format</text>
    <text x="66" y="110" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">Instagram · TikTok</text>

    <rect x="128" y="58" width="100" height="60" rx="8" fill="#EFF6FF"/>
    <text x="178" y="82" font-family="Arial,sans-serif" font-size="22" fill="#1A1A4E" text-anchor="middle" font-weight="bold">1:1</text>
    <text x="178" y="96" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Square Format</text>
    <text x="178" y="110" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">Facebook · Twitter</text>

    <rect x="16" y="130" width="208" height="38" rx="8" fill="#1A1A4E"/>
    <text x="120" y="148" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle" font-weight="bold">MP4 · MOV · Editable</text>
    <text x="120" y="162" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.7">Ready to post · Full Resell Rights</text>
