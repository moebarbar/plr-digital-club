<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Phone mockup 1 - main -->
  <g transform="translate(68, 38)" filter="url(#shadow)">
    <rect width="130" height="230" rx="20" fill="#0D1B3E"/>
    <rect x="6" y="6" width="118" height="218" rx="16" fill="#1A1A4E"/>
    <!-- Reel content area -->
    <rect x="6" y="6" width="118" height="218" rx="16" fill="#1565C0" opacity="0.25"/>
    <!-- Video frame lines -->
    <rect x="6" y="6" width="118" height="145" rx="16" fill="#0D1B3E"/>
    <rect x="6" y="143" width="118" height="8" fill="#0D1B3E"/>
    <!-- Play button -->
    <circle cx="65" cy="78" r="22" fill="#ffffff" opacity="0.15"/>
    <polygon points="58,68 58,88 80,78" fill="#ffffff" opacity="0.9"/>
    <!-- Motivational text overlay -->
    <rect x="12" y="110" width="106" height="28" rx="4" fill="#000000" opacity="0.4"/>
    <text x="65" y="122" font-family="Georgia,serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">Believe in</text>
    <text x="65" y="133" font-family="Georgia,serif" font-size="9" fill="#93C5FD" text-anchor="middle" font-weight="bold">Yourself</text>
    <!-- Bottom bar UI -->
    <rect x="6" y="151" width="118" height="73" rx="0" fill="#1A1A4E"/>
    <rect x="6" y="219" width="118" height="5" rx="0" fill="#1A1A4E"/>
    <!-- Reel actions -->
    <text x="108" y="168" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">♥</text>
    <text x="108" y="182" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">24K</text>
    <text x="108" y="196" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">💬</text>
    <text x="108" y="210" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">843</text>
    <!-- Caption -->
    <text x="20" y="168" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" font-weight="bold">@yourpage</text>
    <text x="20" y="179" font-family="Arial,sans-serif" font-size="6" fill="#D1D5DB">Rise and grind ✨</text>
    <text x="20" y="190" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD">#motivation #mindset</text>
    <!-- Progress bar -->
    <rect x="12" y="215" width="96" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
    <rect x="12" y="215" width="40" height="2" rx="1" fill="#93C5FD" opacity="0.8"/>
  </g>

  <!-- Phone mockup 2 -->
  <g transform="translate(218, 70)" filter="url(#shadow)">
    <rect width="118" height="210" rx="18" fill="#0D1B3E"/>
    <rect x="5" y="5" width="108" height="200" rx="14" fill="#1A1A4E"/>
    <rect x="5" y="5" width="108" height="130" rx="14" fill="#0D2B6E"/>
    <rect x="5" y="127" width="108" height="8" fill="#0D2B6E"/>
