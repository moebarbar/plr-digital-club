    <text x="18" y="163" font-family="Arial,sans-serif" font-size="6" fill="#D1D5DB">No excuses 💪</text>
    <rect x="10" y="172" width="88" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
    <rect x="10" y="172" width="70" height="2" rx="1" fill="#1565C0" opacity="0.8"/>
