    <text x="95" y="155" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">♥</text>
    <text x="95" y="166" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF" text-anchor="middle">31K</text>
  </g>

  <!-- Info panel right -->
