    <text x="120" y="30" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Platform Coverage</text>
    <rect x="20" y="38" width="200" height="1" fill="#ffffff" opacity="0.15"/>

    <text x="28" y="62" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD">📱</text>
    <text x="46" y="62" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Instagram Reels</text>
    <text x="28" y="82" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD">🎵</text>
    <text x="46" y="82" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">TikTok Videos</text>
    <text x="28" y="102" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD">▶️</text>
    <text x="46" y="102" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">YouTube Shorts</text>
    <text x="28" y="122" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD">📘</text>
    <text x="46" y="122" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Facebook Reels</text>

    <rect x="20" y="134" width="200" height="1" fill="#ffffff" opacity="0.1"/>

    <text x="120" y="160" font-family="Arial,sans-serif" font-size="28" fill="#93C5FD" text-anchor="middle" font-weight="bold">100+</text>
    <text x="120" y="176" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.7">Motivational Clips</text>

    <rect x="20" y="186" width="200" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="120" y="208" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Inspire · Uplift · Sell</text>
  </g>

  <!-- Label -->
  <text x="305" y="463" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Social Media Reels</text>
  <rect x="170" y="472" width="270" height="22" rx="11" fill="#ffffff" opacity="0.1"/>
  <text x="305" y="488" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
