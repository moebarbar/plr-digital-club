    <text x="18" y="152" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" font-weight="bold">@dailymotivation</text>
    <text x="18" y="163" font-family="Arial,sans-serif" font-size="6" fill="#D1D5DB">Start your morning right 🌅</text>
    <rect x="10" y="172" width="88" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
    <rect x="10" y="172" width="55" height="2" rx="1" fill="#93C5FD" opacity="0.8"/>
    <text x="18" y="185" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD">#mindset #success</text>
    <text x="95" y="155" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">♥</text>
    <text x="95" y="166" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF" text-anchor="middle">18K</text>
  </g>

  <!-- Phone mockup 3 -->
  <g transform="translate(354, 55)" filter="url(#shadow)">
    <rect width="118" height="210" rx="18" fill="#0D1B3E"/>
    <rect x="5" y="5" width="108" height="200" rx="14" fill="#1A1A4E"/>
    <rect x="5" y="5" width="108" height="130" rx="14" fill="#091535"/>
    <rect x="5" y="127" width="108" height="8" fill="#091535"/>
    <!-- Abstract motivational visual -->
    <circle cx="59" cy="60" r="30" fill="#1565C0" opacity="0.2"/>
    <circle cx="59" cy="60" r="20" fill="#1565C0" opacity="0.3"/>
    <text x="59" y="66" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">⚡</text>
    <text x="59" y="88" font-family="Georgia,serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">DO THE WORK</text>
    <text x="59" y="100" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Every. Single. Day.</text>
    <text x="59" y="115" font-family="Arial,sans-serif" font-size="7" fill="#EFF6FF" text-anchor="middle" opacity="0.5">· · · · · · · · · · · ·</text>
