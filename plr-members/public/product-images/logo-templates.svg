<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Logo card 1 - Wordmark style -->
  <g transform="translate(65, 58)" filter="url(#shadow)">
    <rect width="180" height="120" rx="12" fill="#ffffff"/>
    <rect x="12" y="12" width="156" height="96" rx="8" fill="#F8F8FF"/>
    <rect x="12" y="12" width="156" height="96" rx="8" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <text x="90" y="52" font-family="Georgia,serif" font-size="20" fill="#1A1A4E" text-anchor="middle" font-weight="bold">APEX</text>
    <rect x="30" y="58" width="120" height="2" fill="#1565C0"/>
    <text x="90" y="76" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle" letter-spacing="4">STUDIOS</text>
    <text x="90" y="100" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">Wordmark Style</text>
  </g>

  <!-- Logo card 2 - Icon + text -->
  <g transform="translate(265, 58)" filter="url(#shadow)">
    <rect width="180" height="120" rx="12" fill="#1A1A4E"/>
    <rect x="12" y="12" width="156" height="96" rx="8" fill="#ffffff" opacity="0.05"/>
    <!-- Hexagon icon -->
    <polygon points="90,24 110,36 110,60 90,72 70,60 70,36" fill="#1565C0"/>
    <polygon points="90,30 106,40 106,58 90,68 74,58 74,40" fill="#1A1A4E"/>
    <text x="90" y="55" font-family="Arial,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="bold">N</text>
    <text x="90" y="88" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" letter-spacing="1">NEXUS</text>
    <text x="90" y="100" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Icon + Text Style</text>
  </g>

  <!-- Logo card 3 - Monogram -->
  <g transform="translate(465, 58)" filter="url(#shadow)">
    <rect width="180" height="120" rx="12" fill="#ffffff"/>
    <rect x="12" y="12" width="156" height="96" rx="8" fill="#EFF6FF"/>
    <circle cx="90" cy="54" r="28" fill="#1565C0"/>
    <text x="90" y="62" font-family="Georgia,serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">AB</text>
    <text x="90" y="98" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">Monogram Style</text>
  </g>

  <!-- Logo card 4 - Minimal line -->
  <g transform="translate(665, 58)" filter="url(#shadow)">
    <rect width="115" height="120" rx="12" fill="#ffffff"/>
    <rect x="10" y="12" width="95" height="96" rx="8" fill="#F8F8FF" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Triangle logo -->
    <polygon points="57,22 90,70 24,70" fill="none" stroke="#1A1A4E" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="57,34 78,66 36,66" fill="#1565C0" opacity="0.2"/>
    <text x="57" y="95" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">Geometric</text>
  </g>

  <!-- Large showcase area -->
  <g transform="translate(65, 200)" filter="url(#shadow)">
    <rect width="480" height="248" rx="12" fill="#ffffff"/>
    <rect width="480" height="48" rx="12" fill="#1A1A4E"/>
    <rect y="36" width="480" height="12" fill="#1A1A4E"/>
    <text x="240" y="28" font-family="Georgia,serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Logo Design Editor</text>

    <!-- Toolbar -->
    <rect x="0" y="48" width="480" height="28" fill="#F9FAFB"/>
    <rect x="0" y="76" width="480" height="1" fill="#E5E7EB"/>
    <rect x="12" y="55" width="50" height="14" rx="3" fill="#1565C0"/>
    <text x="37" y="65" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Colors</text>
    <rect x="68" y="55" width="50" height="14" rx="3" fill="#F3F4F6"/>
    <text x="93" y="65" font-family="Arial,sans-serif" font-size="8" fill="#374151" text-anchor="middle">Fonts</text>
    <rect x="124" y="55" width="50" height="14" rx="3" fill="#F3F4F6"/>
    <text x="149" y="65" font-family="Arial,sans-serif" font-size="8" fill="#374151" text-anchor="middle">Layout</text>
    <rect x="180" y="55" width="50" height="14" rx="3" fill="#F3F4F6"/>
    <text x="205" y="65" font-family="Arial,sans-serif" font-size="8" fill="#374151" text-anchor="middle">Export</text>

    <!-- Canvas with logo preview -->
    <rect x="12" y="88" width="280" height="148" rx="6" fill="#F8F8FF" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Checkered pattern for transparency -->
    <rect x="12" y="88" width="280" height="148" rx="6" fill="url(#bg)" opacity="0.03"/>
    <!-- Featured logo design -->
    <circle cx="152" cy="140" r="38" fill="#1A1A4E"/>
    <circle cx="152" cy="140" r="30" fill="#1565C0" opacity="0.4"/>
    <text x="152" y="134" font-family="Georgia,serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">P</text>
    <text x="152" y="152" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle" font-weight="bold">PEAK</text>
    <text x="152" y="226" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Canvas Preview</text>

    <!-- Right panel -->
    <rect x="304" y="88" width="164" height="148" rx="6" fill="#F9FAFB"/>
    <text x="386" y="108" font-family="Arial,sans-serif" font-size="9" fill="#374151" text-anchor="middle" font-weight="bold">Color Palette</text>
    <circle cx="330" cy="128" r="12" fill="#1A1A4E"/>
    <circle cx="358" cy="128" r="12" fill="#1565C0"/>
    <circle cx="386" cy="128" r="12" fill="#93C5FD"/>
    <circle cx="414" cy="128" r="12" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="442" cy="128" r="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>

    <text x="386" y="158" font-family="Arial,sans-serif" font-size="9" fill="#374151" text-anchor="middle" font-weight="bold">Font Style</text>
    <text x="386" y="172" font-family="Georgia,serif" font-size="12" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Aa</text>
    <text x="386" y="184" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Georgia Serif</text>

    <rect x="316" y="196" width="136" height="28" rx="6" fill="#1A1A4E"/>
    <text x="384" y="214" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">Download Logo</text>
  </g>

  <!-- Right side cards -->
  <g transform="translate(572, 200)" filter="url(#shadow2)">
    <rect width="208" height="115" rx="12" fill="#1565C0" opacity="0.15"/>
    <rect width="208" height="115" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <text x="104" y="32" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Formats Included</text>
    <rect x="20" y="42" width="168" height="1" fill="#ffffff" opacity="0.15"/>
    <text x="104" y="62" font-family="Arial,sans-serif" font-size="24" fill="#93C5FD" text-anchor="middle" font-weight="bold">PNG · SVG</text>
    <text x="104" y="80" font-family="Arial,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle">PDF · EPS · AI</text>
    <rect x="20" y="90" width="168" height="1" fill="#ffffff" opacity="0.15"/>
    <text x="104" y="108" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.7">All formats, print &amp; digital ready</text>
  </g>

  <g transform="translate(572, 333)" filter="url(#shadow2)">
    <rect width="208" height="115" rx="12" fill="#1A1A4E"/>
    <rect width="208" height="115" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
    <text x="104" y="32" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Industries Covered</text>
    <rect x="20" y="40" width="168" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="30" y="60" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🏢 Corporate</text>
    <text x="118" y="60" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🛍️ Retail</text>
    <text x="30" y="78" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">💻 Tech</text>
    <text x="118" y="78" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🍽️ Food</text>
    <text x="30" y="96" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">💪 Fitness</text>
    <text x="118" y="96" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🎨 Creative</text>
    <text x="104" y="112" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.5">+ many more</text>
  </g>
</svg>
