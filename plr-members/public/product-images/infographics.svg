    <text x="58" y="164" font-family="Arial,sans-serif" font-size="22" fill="#93C5FD" text-anchor="middle" font-weight="bold">50K</text>
    <text x="58" y="178" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">Users</text>
