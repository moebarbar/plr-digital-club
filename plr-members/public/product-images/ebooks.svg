<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#1A1A4E"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F8FF"/>
      <stop offset="100%" style="stop-color:#EFF6FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="70" r="160" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="440" r="130" fill="#ffffff" opacity="0.03"/>
  <circle cx="400" cy="250" r="280" fill="#ffffff" opacity="0.02"/>

  <!-- E-reader device -->
  <g transform="translate(80, 60)" filter="url(#shadow)">
    <rect width="210" height="320" rx="18" fill="#0F172A"/>
    <rect x="2" y="2" width="206" height="316" rx="16" fill="#1E293B"/>
    <!-- Screen bezel -->
    <rect x="14" y="20" width="182" height="248" rx="8" fill="url(#screen)"/>
    <!-- Screen content - book being read -->
    <rect x="14" y="20" width="182" height="36" rx="8" fill="#1A1A4E"/>
    <rect x="14" y="48" width="182" height="8" fill="#1A1A4E"/>
    <text x="105" y="43" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Digital Marketing Guide</text>
    <!-- Reading lines -->
    <rect x="26" y="68" width="158" height="4" rx="2" fill="#374151" opacity="0.6"/>
    <rect x="26" y="78" width="145" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="88" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="98" width="120" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="112" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="122" width="138" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="132" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="146" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="156" width="100" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="170" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="180" width="148" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="190" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="204" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="214" width="128" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="228" width="158" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <rect x="26" y="238" width="140" height="4" rx="2" fill="#374151" opacity="0.45"/>
    <!-- Reading progress -->
    <rect x="26" y="254" width="158" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="26" y="254" width="95" height="4" rx="2" fill="#1565C0"/>
    <text x="105" y="264" font-family="Arial,sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">Page 142 of 298</text>
    <!-- Home button -->
    <circle cx="105" cy="293" r="15" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="105" cy="293" r="9" fill="#0F172A"/>
  </g>

  <!-- Book stack -->
  <g transform="translate(330, 95)" filter="url(#shadow)">
    <!-- Shadow book -->
    <rect x="8" y="8" width="130" height="185" rx="6" fill="#000000" opacity="0.2"/>
    <!-- Book 3 (bottom) -->
    <rect x="4" y="4" width="130" height="185" rx="6" fill="url(#bookB)"/>
    <rect x="4" y="4" width="16" height="185" rx="4" fill="#0D1F4A"/>
    <rect x="10" y="22" width="4" height="149" rx="2" fill="#ffffff" opacity="0.15"/>
    <!-- Book 2 (middle) -->
    <rect x="0" y="-6" width="130" height="185" rx="6" fill="url(#bookA)"/>
    <rect x="0" y="-6" width="16" height="185" rx="4" fill="#0A3270"/>
    <rect x="6" y="12" width="4" height="149" rx="2" fill="#ffffff" opacity="0.15"/>
    <!-- Book 1 (top) -->
    <rect x="-4" y="-16" width="130" height="185" rx="6" fill="url(#bookC)"/>
    <rect x="-4" y="-16" width="16" height="185" rx="4" fill="#1A4DB0"/>
    <rect x="2" y="2" width="4" height="149" rx="2" fill="#ffffff" opacity="0.2"/>
    <!-- Top book content -->
    <rect x="22" y="10" width="98" height="55" rx="4" fill="#ffffff" opacity="0.1"/>
    <text x="71" y="43" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#ffffff">📖</text>
    <rect x="22" y="78" width="98" height="2" fill="#ffffff" opacity="0.3"/>
    <text x="71" y="98" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">PASSIVE INCOME</text>
    <text x="71" y="112" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">COMPLETE GUIDE</text>
    <rect x="22" y="122" width="98" height="2" fill="#ffffff" opacity="0.15"/>
    <rect x="22" y="134" width="70" height="3" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="22" y="142" width="55" height="3" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="22" y="155" width="60" height="14" rx="7" fill="#ffffff" opacity="0.15"/>
    <text x="52" y="165" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">PLR Rights</text>
  </g>

  <!-- Floating genre tags -->
  <g transform="translate(310, 310)">
    <rect width="110" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="55" y="19" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">💼 Business</text>
  </g>
  <g transform="translate(435, 310)">
    <rect width="100" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="50" y="19" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">💪 Fitness</text>
  </g>
  <g transform="translate(310, 348)">
    <rect width="100" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="50" y="19" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">💰 Finance</text>
  </g>
  <g transform="translate(425, 348)">
    <rect width="115" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="57" y="19" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">🌿 Lifestyle</text>
  </g>
  <g transform="translate(355, 386)">
    <rect width="130" height="28" rx="14" fill="#1565C0" opacity="0.5"/>
    <text x="65" y="19" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">+20 more genres</text>
  </g>

  <!-- Right stat card -->
  <g transform="translate(540, 80)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="#ffffff" opacity="0.08"/>
    <rect width="190" height="230" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="95" y="36" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Library Stats</text>
    <rect x="20" y="44" width="150" height="1" fill="#ffffff" opacity="0.15"/>
    <!-- Stats -->
    <text x="95" y="80" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#93C5FD" text-anchor="middle">300K+</text>
    <text x="95" y="98" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.7">Total eBooks</text>
    <rect x="20" y="110" width="150" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="95" y="132" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#93C5FD" text-anchor="middle">20+</text>
    <text x="95" y="148" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.7">Genres Covered</text>
    <rect x="20" y="158" width="150" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="95" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#93C5FD" text-anchor="middle">100%</text>
    <text x="95" y="196" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.7">PLR Rights Included</text>
    <rect x="20" y="210" width="150" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="95" y="226" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">All Devices Supported</text>
  </g>

  <!-- Main label -->
  <text x="400" y="432" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">eBooks</text>
  <text x="400" y="458" font-family="Arial,sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">300,000+ Digital Books · Full PLR Rights</text>

  <rect x="310" y="470" width="180" height="24" rx="12" fill="#ffffff" opacity="0.1"/>
  <text x="400" y="487" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
