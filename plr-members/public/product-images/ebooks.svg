    <rect x="14" y="0" width="72" height="185" rx="3" fill="url(#book2)"/>
    <rect x="16" y="16" width="68" height="2" fill="#ffffff" opacity="0.2"/>
    <rect x="16" y="167" width="68" height="2" fill="#ffffff" opacity="0.2"/>
    <text x="50" y="100" font-family="Georgia,serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold" transform="rotate(-90,50,100)">PASSIVE INCOME</text>
    <rect x="20" y="68" width="60" height="48" rx="2" fill="#ffffff" opacity="0.1"/>
    <text x="50" y="97" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">💰</text>
