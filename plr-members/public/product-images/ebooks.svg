    <rect x="24" y="52" width="152" height="1" fill="#E5E7EB"/>
    <rect x="24" y="62" width="145" height="4" rx="2" fill="#374151" opacity="0.7"/>
    <rect x="24" y="72" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="82" width="130" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="96" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="106" width="140" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="116" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="130" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="140" width="120" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="154" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="164" width="135" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="174" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="188" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="198" width="110" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="212" width="152" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="222" width="145" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="24" y="236" width="130" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <!-- Progress bar at bottom of screen -->
    <rect x="24" y="248" width="152" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="248" width="80" height="3" rx="2" fill="#1565C0"/>
    <!-- Home button -->
    <circle cx="100" cy="285" r="14" fill="#374151"/>
    <circle cx="100" cy="285" r="10" fill="#4B5563"/>
