  <text x="295" y="445" font-family="Arial,sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">300k+ Digital Books · All Genres · All Devices</text>

  <rect x="205" y="458" width="180" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="295" y="477" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
