<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A148C"/>
      <stop offset="100%" style="stop-color:#6A1B9A"/>
    </linearGradient>
    <linearGradient id="book4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B71C1C"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    <linearGradient id="book5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E65100"/>
      <stop offset="100%" style="stop-color:#EF6C00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Bookshelf row 1 -->
  <!-- Book 1 - Blue -->
  <g transform="translate(72, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="18" height="200" rx="2" fill="#0A3880"/>
    <rect x="16" y="0" width="68" height="200" rx="3" fill="url(#book1)"/>
    <rect x="18" y="20" width="64" height="2" fill="#ffffff" opacity="0.2"/>
    <rect x="18" y="178" width="64" height="2" fill="#ffffff" opacity="0.2"/>
    <text x="50" y="115" font-family="Georgia,serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold" transform="rotate(-90,50,115)">DIGITAL MARKETING</text>
    <rect x="22" y="80" width="56" height="40" rx="2" fill="#ffffff" opacity="0.1"/>
    <text x="50" y="105" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">📈</text>
