<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Photoshop panels mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="470" height="355" rx="12" fill="#2B2B2B"/>
    <!-- Title bar -->
    <rect width="470" height="32" rx="12" fill="#1E1E1E"/>
    <rect y="20" width="470" height="12" fill="#1E1E1E"/>
    <circle cx="18" cy="16" r="5" fill="#FF5F57"/>
    <circle cx="34" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="16" r="5" fill="#28CA41"/>
    <text x="235" y="21" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Adobe Photoshop — design_assets.psd</text>

    <!-- Tool bar left -->
    <rect x="0" y="32" width="36" height="323" fill="#252525"/>
    <text x="18" y="54" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#BBBBBB">↖</text>
    <text x="18" y="76" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">✏️</text>
    <text x="18" y="98" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🔲</text>
    <text x="18" y="120" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🪄</text>
    <text x="18" y="142" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🪣</text>
    <!-- Foreground/background color -->
    <rect x="8" y="300" width="16" height="16" rx="2" fill="#1A1A4E"/>
    <rect x="14" y="306" width="16" height="16" rx="2" fill="#ffffff" stroke="#252525" stroke-width="1"/>

    <!-- Canvas -->
    <rect x="36" y="32" width="292" height="323" fill="#3C3C3C"/>
    <!-- Document bg -->
    <rect x="50" y="50" width="264" height="290" rx="2" fill="#1A1A1A"/>
    <!-- Layered design preview -->
    <!-- Background texture layer -->
    <rect x="50" y="50" width="264" height="290" rx="2" fill="#0D1B3E" opacity="0.8"/>
    <!-- Gradient overlay -->
    <rect x="50" y="50" width="264" height="145" rx="2" fill="#1565C0" opacity="0.1"/>
    <!-- Pattern layer - dots -->
    <circle cx="90" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="120" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="150" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="180" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="210" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="240" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="270" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <circle cx="300" cy="90" r="3" fill="#ffffff" opacity="0.05"/>
    <!-- Shape layer -->
    <circle cx="182" cy="185" r="65" fill="#1565C0" opacity="0.12"/>
    <circle cx="182" cy="185" r="45" fill="#1565C0" opacity="0.15"/>
    <!-- Text layer preview -->
    <text x="182" y="172" font-family="Georgia,serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold" opacity="0.9">DESIGN</text>
    <text x="182" y="192" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle" letter-spacing="4" opacity="0.8">STUDIO</text>
    <!-- Gradient layer -->
    <rect x="50" y="270" width="264" height="70" rx="0" fill="#000000" opacity="0.3"/>
    <!-- Brushstroke texture overlay -->
    <path d="M60,230 Q120,220 180,235 Q240,250 310,225" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.12"/>

    <!-- Right panels stack -->
    <rect x="328" y="32" width="142" height="323" fill="#252525"/>
    <!-- Layers panel -->
    <text x="399" y="52" font-family="Arial,sans-serif" font-size="8" fill="#BBBBBB" text-anchor="middle" font-weight="bold">Layers</text>
    <rect x="336" y="58" width="126" height="1" fill="#3C3C3C"/>
    <!-- Layer items -->
    <rect x="336" y="64" width="126" height="22" rx="2" fill="#1565C0" opacity="0.3"/>
    <text x="346" y="78" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD">T  Text Layer</text>
    <rect x="336" y="90" width="126" height="22" rx="2" fill="#3C3C3C"/>
    <text x="346" y="104" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF">◯  Shape Group</text>
    <rect x="336" y="116" width="126" height="22" rx="2" fill="#3C3C3C"/>
    <text x="346" y="130" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF">🎨  Gradient Map</text>
    <rect x="336" y="142" width="126" height="22" rx="2" fill="#3C3C3C"/>
    <text x="346" y="156" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF">✨  Pattern Overlay</text>
    <rect x="336" y="168" width="126" height="22" rx="2" fill="#3C3C3C"/>
    <text x="346" y="182" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF">🖼️  Background</text>
    <!-- Properties panel -->
    <rect x="336" y="198" width="126" height="1" fill="#3C3C3C"/>
    <text x="399" y="216" font-family="Arial,sans-serif" font-size="8" fill="#BBBBBB" text-anchor="middle" font-weight="bold">Properties</text>
    <text x="340" y="234" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Color Swatches</text>
    <circle cx="344" cy="248" r="7" fill="#1A1A4E"/>
    <circle cx="360" cy="248" r="7" fill="#1565C0"/>
    <circle cx="376" cy="248" r="7" fill="#93C5FD"/>
    <circle cx="392" cy="248" r="7" fill="#EFF6FF" stroke="#3C3C3C" stroke-width="1"/>
    <circle cx="408" cy="248" r="7" fill="#ffffff" stroke="#3C3C3C" stroke-width="1"/>
    <text x="340" y="270" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Gradients</text>
    <rect x="340" y="276" width="118" height="12" rx="2" fill="#1A1A4E"/>
    <rect x="340" y="276" width="59" height="12" rx="2" fill="#1565C0"/>
    <text x="340" y="302" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Patterns</text>
    <rect x="340" y="308" width="26" height="20" rx="2" fill="#1A1A4E" opacity="0.8"/>
    <rect x="371" y="308" width="26" height="20" rx="2" fill="#1565C0" opacity="0.5"/>
    <rect x="402" y="308" width="26" height="20" rx="2" fill="#0D1B3E" opacity="0.8"/>
    <rect x="433" y="308" width="26" height="20" rx="2" fill="#1A2535" opacity="0.8"/>
    <!-- Textures -->
    <text x="399" y="342" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">Textures · Styles · Shapes</text>
    <text x="399" y="348" font-family="Arial,sans-serif" font-size="0" fill="#ffffff">·</text>
  </g>

  <!-- Right info panels -->
  <g transform="translate(548, 42)" filter="url(#shadow2)">
    <rect width="210" height="168" rx="12" fill="#ffffff"/>
    <rect width="210" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="210" height="12" fill="#1A1A4E"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Asset Categories</text>

    <rect x="14" y="56" width="86" height="40" rx="6" fill="#EFF6FF"/>
    <text x="57" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🖌️</text>
    <text x="57" y="86" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Brushes</text>

    <rect x="110" y="56" width="86" height="40" rx="6" fill="#EFF6FF"/>
    <text x="153" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🌈</text>
    <text x="153" y="86" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Gradients</text>

    <rect x="14" y="104" width="86" height="40" rx="6" fill="#EFF6FF"/>
    <text x="57" y="120" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🧩</text>
    <text x="57" y="134" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Patterns</text>

    <rect x="110" y="104" width="86" height="40" rx="6" fill="#EFF6FF"/>
    <text x="153" y="120" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🪨</text>
    <text x="153" y="134" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Textures</text>
  </g>

  <g transform="translate(548, 228)" filter="url(#shadow2)">
    <rect width="210" height="170" rx="12" fill="#1A1A4E"/>
    <rect width="210" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="210" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Included</text>

    <text x="22" y="62" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="62" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Brushes (.ABR files)</text>
    <text x="22" y="82" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="82" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Gradients (.GRD files)</text>
    <text x="22" y="102" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="102" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Patterns (.PAT files)</text>
    <text x="22" y="122" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="122" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Textures (JPG · PNG)</text>
    <text x="22" y="142" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="142" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Layer Styles (.ASL files)</text>

    <rect x="16" y="152" width="178" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="165" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">PS CS4+ · CC · PLR Rights</text>
  </g>

  <!-- Label -->
  <text x="308" y="438" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Photoshop Assets</text>
  <text x="308" y="460" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">Brushes · Gradients · Patterns · Textures · Styles</text>
  <rect x="168" y="472" width="280" height="22" rx="11" fill="#ffffff" opacity="0.1"/>
  <text x="308" y="488" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
