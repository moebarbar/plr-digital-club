<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Stream overlay mockup - main panel -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="470" height="300" rx="12" fill="#0D0D1A"/>
    <!-- Stream scene background -->
    <rect x="0" y="0" width="470" height="300" rx="12" fill="#111827"/>
    <!-- Grid overlay subtle -->
    <line x1="0" y1="75" x2="470" y2="75" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>
    <line x1="0" y1="150" x2="470" y2="150" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>
    <line x1="0" y1="225" x2="470" y2="225" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>
    <line x1="117" y1="0" x2="117" y2="300" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>
    <line x1="235" y1="0" x2="235" y2="300" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>
    <line x1="352" y1="0" x2="352" y2="300" stroke="#1565C0" stroke-width="0.3" opacity="0.2"/>

    <!-- Main game viewport -->
