    <rect x="261" y="163" width="38" height="38" rx="2" fill="#0D1B3E"/>
    <circle cx="278" cy="182" r="3" fill="#93C5FD"/>
    <circle cx="290" cy="175" r="2" fill="#ff6b6b" opacity="0.7"/>

    <!-- Webcam overlay box -->
