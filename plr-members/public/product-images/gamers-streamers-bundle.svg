    <text x="22" y="282" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD" font-weight="bold">StreamFan:</text>
    <text x="78" y="282" font-family="Arial,sans-serif" font-size="6" fill="#D1D5DB">POGGERS let's GOOO 🎮</text>

