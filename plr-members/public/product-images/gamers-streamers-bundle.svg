    <rect x="12" y="220" width="296" height="28" rx="4" fill="#0D0D0D" opacity="0.85"/>
    <rect x="12" y="220" width="4" height="28" rx="2" fill="#ff4444"/>
    <text x="24" y="232" font-family="Arial,sans-serif" font-size="7" fill="#ff4444" font-weight="bold">LIVE</text>
    <text x="50" y="232" font-family="Arial,sans-serif" font-size="7" fill="#ffffff">Ranked Match · Solo Queue</text>
    <text x="296" y="232" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="end">👁 1,284</text>
    <text x="296" y="242" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="end">⏱ 02:14:38</text>
    <text x="24" y="242" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">#FPS  #Gaming  #Ranked</text>

