    <rect x="12" y="12" width="296" height="200" rx="6" fill="#1565C0" opacity="0.1"/>
    <!-- Game scene elements -->
    <rect x="20" y="160" width="280" height="46" rx="0" fill="#0A0F1E"/>
    <rect x="40" y="130" width="60" height="76" rx="2" fill="#1A2535" opacity="0.8"/>
    <rect x="200" y="140" width="50" height="66" rx="2" fill="#1A2535" opacity="0.8"/>
    <!-- Player character -->
    <rect x="148" y="145" width="14" height="20" rx="2" fill="#93C5FD" opacity="0.8"/>
