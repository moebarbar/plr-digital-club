    <rect width="210" height="215" rx="12" fill="#1A1A4E"/>
    <rect width="210" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="210" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Level Up Your Stream</text>

    <text x="24" y="64" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Stream overlay packs</text>
    <text x="24" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Animated alerts &amp; transitions</text>
    <text x="24" y="104" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Twitch panels &amp; banners</text>
    <text x="24" y="124" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Custom emotes &amp; badges</text>
    <text x="24" y="144" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Royalty-free stream music</text>
    <text x="24" y="164" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="164" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Sub goals &amp; chat widgets</text>
    <text x="24" y="184" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="184" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">OBS &amp; Streamlabs ready</text>

    <rect x="16" y="196" width="178" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="210" font-family="Arial,sans-serif" font-size="26" fill="#93C5FD" text-anchor="middle" font-weight="bold">⚡</text>
  </g>

  <!-- Label -->
  <text x="308" y="476" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Gamers / Streamers Bundle</text>
  <rect x="155" y="484" width="306" height="14" rx="7" fill="#ffffff" opacity="0.1"/>
