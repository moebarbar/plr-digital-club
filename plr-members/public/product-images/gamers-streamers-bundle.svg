    <!-- Health bar UI -->
    <rect x="20" y="20" width="120" height="14" rx="7" fill="#0D0D0D" opacity="0.8"/>
    <rect x="22" y="22" width="100" height="10" rx="5" fill="#1A1A4E"/>
    <rect x="22" y="22" width="76" height="10" rx="5" fill="#1565C0"/>
    <text x="148" y="31" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD">76 HP</text>
    <!-- Score -->
