    <text x="153" y="89" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">YouTube</text>

    <rect x="14" y="108" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="57" y="126" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🎵</text>
    <text x="57" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">TikTok Live</text>

    <rect x="110" y="108" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="153" y="126" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🎮</text>
    <text x="153" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Kick &amp; More</text>

    <rect x="14" y="160" width="182" height="12" rx="4" fill="#1A1A4E" opacity="0.05"/>
    <text x="105" y="170" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">All major streaming platforms</text>
