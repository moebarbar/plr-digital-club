    <text x="387" y="54" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">🎮</text>
    <text x="387" y="100" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle" font-weight="bold">xYourChannel</text>
