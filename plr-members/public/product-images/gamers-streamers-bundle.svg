    <text x="411" y="60" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#93C5FD">⚡</text>
    <text x="411" y="74" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD" text-anchor="middle" font-weight="bold">Emotes &amp; Badges</text>
