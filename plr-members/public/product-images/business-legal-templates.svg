<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Main document mockup -->
  <g transform="translate(62, 42)" filter="url(#shadow)">
    <rect width="310" height="380" rx="12" fill="#ffffff"/>
    <!-- Document header -->
    <rect width="310" height="56" rx="12" fill="#1A1A4E"/>
    <rect y="44" width="310" height="12" fill="#1A1A4E"/>
    <text x="155" y="28" font-family="Georgia,serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Business Contract</text>
    <text x="155" y="44" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Professional Legal Template</text>

    <!-- Document body lines (simulating text) -->
    <text x="155" y="84" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle" font-weight="bold">SERVICE AGREEMENT</text>
    <rect x="24" y="92" width="262" height="1" fill="#E5E7EB"/>

    <text x="24" y="108" font-family="Arial,sans-serif" font-size="8" fill="#374151" font-weight="bold">PARTIES:</text>
    <rect x="24" y="114" width="200" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="122" width="180" height="3" rx="2" fill="#E5E7EB"/>

    <text x="24" y="140" font-family="Arial,sans-serif" font-size="8" fill="#374151" font-weight="bold">1. SCOPE OF WORK</text>
    <rect x="24" y="148" width="260" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="156" width="240" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="164" width="250" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="172" width="200" height="3" rx="2" fill="#E5E7EB"/>

    <text x="24" y="192" font-family="Arial,sans-serif" font-size="8" fill="#374151" font-weight="bold">2. PAYMENT TERMS</text>
    <rect x="24" y="200" width="260" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="208" width="230" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="216" width="245" height="3" rx="2" fill="#E5E7EB"/>

    <text x="24" y="236" font-family="Arial,sans-serif" font-size="8" fill="#374151" font-weight="bold">3. CONFIDENTIALITY</text>
    <rect x="24" y="244" width="260" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="252" width="220" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="260" width="250" height="3" rx="2" fill="#E5E7EB"/>

    <text x="24" y="280" font-family="Arial,sans-serif" font-size="8" fill="#374151" font-weight="bold">4. TERMINATION</text>
    <rect x="24" y="288" width="260" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="24" y="296" width="200" height="3" rx="2" fill="#E5E7EB"/>

    <!-- Signature section -->
    <rect x="24" y="316" width="262" height="1" fill="#E5E7EB"/>
    <text x="24" y="334" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Client Signature: _________________</text>
    <text x="24" y="350" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Service Provider: _________________</text>
    <text x="24" y="366" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Date: ___________________________</text>

    <!-- PLR stamp -->
    <circle cx="260" cy="340" r="28" fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 2" opacity="0.5"/>
    <text x="260" y="336" font-family="Arial,sans-serif" font-size="7" fill="#1565C0" text-anchor="middle" font-weight="bold">PLR</text>
    <text x="260" y="347" font-family="Arial,sans-serif" font-size="6" fill="#1565C0" text-anchor="middle">TEMPLATE</text>
  </g>

  <!-- Right side - template cards -->
  <g transform="translate(396, 42)" filter="url(#shadow2)">
    <rect width="350" height="172" rx="12" fill="#ffffff"/>
    <rect width="350" height="44" rx="12" fill="#1565C0" opacity="0.9"/>
    <rect y="32" width="350" height="12" fill="#1565C0" opacity="0.9"/>
    <text x="175" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Template Categories</text>

    <!-- Grid of template types -->
    <rect x="14" y="56" width="74" height="50" rx="6" fill="#EFF6FF"/>
    <text x="51" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">📋</text>
    <text x="51" y="94" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Contracts</text>

    <rect x="96" y="56" width="74" height="50" rx="6" fill="#EFF6FF"/>
    <text x="133" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🤝</text>
    <text x="133" y="94" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Agreements</text>

    <rect x="178" y="56" width="74" height="50" rx="6" fill="#EFF6FF"/>
    <text x="215" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🧾</text>
    <text x="215" y="94" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Invoices</text>

    <rect x="260" y="56" width="76" height="50" rx="6" fill="#EFF6FF"/>
    <text x="298" y="78" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">📜</text>
    <text x="298" y="94" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Proposals</text>

    <!-- Bottom bar -->
    <rect x="14" y="120" width="322" height="38" rx="8" fill="#1A1A4E"/>
    <text x="175" y="137" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle" font-weight="bold">NDA · Privacy Policy · Terms of Service</text>
    <text x="175" y="150" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.7">Fully editable · Word &amp; PDF formats</text>
  </g>

  <!-- Stats panel -->
  <g transform="translate(396, 232)" filter="url(#shadow2)">
    <rect width="350" height="190" rx="12" fill="#1A1A4E"/>
    <rect width="350" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="350" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="175" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Included</text>

    <!-- Checklist -->
    <text x="30" y="68" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="48" y="68" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Service Agreements &amp; Freelance Contracts</text>
    <text x="30" y="88" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="48" y="88" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Non-Disclosure Agreements (NDA)</text>
    <text x="30" y="108" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="48" y="108" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Business Proposals &amp; Invoices</text>
    <text x="30" y="128" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="48" y="128" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Privacy Policy &amp; Terms of Service</text>
    <text x="30" y="148" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="48" y="148" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Partnership &amp; Employment Templates</text>

    <rect x="20" y="162" width="310" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="175" y="182" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">DOCX · PDF · Google Docs Ready · PLR Rights</text>
  </g>
</svg>
