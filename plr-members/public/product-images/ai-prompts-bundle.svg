    <text x="168" y="216" font-family="Arial,sans-serif" font-size="7" fill="#D1D5DB">2. 🔥 Everyone's talking about this (limited spots)</text>
    <text x="168" y="230" font-family="Arial,sans-serif" font-size="7" fill="#D1D5DB">3. You're about to miss this forever 😬</text>
    <text x="168" y="244" font-family="Arial,sans-serif" font-size="7" fill="#D1D5DB">4. Only 12 left — don't say we didn't warn you</text>
    <text x="168" y="258" font-family="Arial,sans-serif" font-size="7" fill="#D1D5DB">5. [URGENT] Your exclusive access expires tonight</text>
