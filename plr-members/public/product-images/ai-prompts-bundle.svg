    <text x="22" y="102" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">💡</text>
    <text x="38" y="102" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">Content &amp; SEO</text>
    <text x="22" y="122" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🛒</text>
    <text x="38" y="122" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">E-commerce &amp; sales</text>
    <text x="22" y="142" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🎯</text>
