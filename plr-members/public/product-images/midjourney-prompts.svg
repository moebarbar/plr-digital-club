<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C1D95"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Hero panel -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="470" height="130" rx="12" fill="#0D1B3E"/>
    <rect width="470" height="130" rx="12" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
    <!-- Badge -->
    <rect x="16" y="18" width="88" height="22" rx="11" fill="url(#violet)"/>
    <text x="60" y="33" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ 30K PROMPTS</text>
    <!-- Title -->
    <text x="16" y="72" font-family="Georgia,serif" font-size="22" fill="#ffffff" font-weight="bold">30,000 MidJourney</text>
    <text x="16" y="95" font-family="Georgia,serif" font-size="22" fill="#C4B5FD" font-weight="bold">Prompt Collection</text>
    <rect x="16" y="106" width="200" height="2" fill="#7C3AED"/>
    <text x="16" y="122" font-family="Arial,sans-serif" font-size="8" fill="#6B7280">For artists, creators &amp; AI enthusiasts · Instant access</text>
    <!-- Icon -->
    <circle cx="415" cy="65" r="50" fill="#7C3AED" opacity="0.08"/>
    <circle cx="415" cy="65" r="30" fill="#7C3AED" opacity="0.1"/>
    <text x="415" y="77" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🎨</text>
  </g>

  <!-- Prompt terminal mockup -->
  <g transform="translate(55, 188)" filter="url(#shadow2)">
    <rect width="470" height="240" rx="12" fill="#0D1B3E"/>
    <rect width="470" height="36" rx="12" fill="#0A0F2E"/>
    <rect y="24" width="470" height="12" fill="#0A0F2E"/>
    <!-- Terminal dots -->
    <circle cx="20" cy="18" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#28C840"/>
    <text x="235" y="24" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">MidJourney Prompt Explorer</text>

    <!-- Category tags row -->
    <rect x="16" y="48" width="68" height="20" rx="10" fill="#7C3AED" opacity="0.8"/>
    <text x="50" y="62" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Portraits</text>
    <rect x="92" y="48" width="72" height="20" rx="10" fill="#1565C0" opacity="0.8"/>
    <text x="128" y="62" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Landscapes</text>
    <rect x="172" y="48" width="60" height="20" rx="10" fill="#065F46" opacity="0.9"/>
    <text x="202" y="62" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Fantasy</text>
    <rect x="240" y="48" width="82" height="20" rx="10" fill="#92400E" opacity="0.9"/>
    <text x="281" y="62" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Architecture</text>
    <rect x="330" y="48" width="68" height="20" rx="10" fill="#4C1D95" opacity="0.9"/>
    <text x="364" y="62" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Abstract</text>

    <!-- Prompt lines -->
    <rect x="16" y="80" width="438" height="32" rx="6" fill="#111827"/>
    <text x="28" y="93" font-family="monospace,Arial" font-size="7.5" fill="#A855F7">/imagine</text>
    <text x="80" y="93" font-family="monospace,Arial" font-size="7.5" fill="#E2E8F0">ethereal portrait of a woman, golden hour, cinematic lighting, 8k --ar 16:9</text>
    <text x="28" y="107" font-family="monospace,Arial" font-size="6" fill="#4B5563">--v 6 --stylize 750 --quality 2</text>

    <rect x="16" y="122" width="438" height="32" rx="6" fill="#111827"/>
    <text x="28" y="135" font-family="monospace,Arial" font-size="7.5" fill="#A855F7">/imagine</text>
    <text x="80" y="135" font-family="monospace,Arial" font-size="7.5" fill="#E2E8F0">misty mountain valley at dawn, hyper-realistic, lush forest --ar 3:2</text>
    <text x="28" y="149" font-family="monospace,Arial" font-size="6" fill="#4B5563">--v 6 --stylize 500 --chaos 20</text>

    <rect x="16" y="164" width="438" height="32" rx="6" fill="#111827"/>
    <text x="28" y="177" font-family="monospace,Arial" font-size="7.5" fill="#A855F7">/imagine</text>
    <text x="80" y="177" font-family="monospace,Arial" font-size="7.5" fill="#E2E8F0">futuristic cyberpunk city, neon lights, rain, ultra detailed --ar 1:1</text>
    <text x="28" y="191" font-family="monospace,Arial" font-size="6" fill="#4B5563">--v 6 --stylize 1000 --quality 2</text>

    <rect x="16" y="206" width="438" height="22" rx="6" fill="#0A0F2E"/>
    <text x="28" y="221" font-family="monospace,Arial" font-size="7.5" fill="#6B7280">+ 29,997 more stunning prompts included...</text>
    <text x="420" y="221" font-family="Arial,sans-serif" font-size="7" fill="#A855F7" text-anchor="end">✦ All categories</text>
  </g>

  <!-- Right panels -->
  <g transform="translate(548, 42)" filter="url(#shadow2)">
    <rect width="210" height="178" rx="12" fill="#ffffff"/>
    <rect width="210" height="44" rx="12" fill="#0D1B3E"/>
    <rect y="32" width="210" height="12" fill="#0D1B3E"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Prompt Categories</text>

    <rect x="14" y="56" width="86" height="44" rx="6" fill="#F5F3FF"/>
    <text x="57" y="74" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🧑‍🎨</text>
    <text x="57" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Portraits</text>

    <rect x="110" y="56" width="86" height="44" rx="6" fill="#F5F3FF"/>
    <text x="153" y="74" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🏔️</text>
    <text x="153" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Landscapes</text>

    <rect x="14" y="108" width="86" height="44" rx="6" fill="#F5F3FF"/>
    <text x="57" y="126" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🐉</text>
    <text x="57" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Fantasy &amp; Sci-Fi</text>

    <rect x="110" y="108" width="86" height="44" rx="6" fill="#F5F3FF"/>
    <text x="153" y="126" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🏛️</text>
    <text x="153" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Architecture</text>
  </g>

  <g transform="translate(548, 234)" filter="url(#shadow2)">
    <rect width="210" height="196" rx="12" fill="#0D1B3E"/>
    <rect width="210" height="44" rx="12" fill="#7C3AED" opacity="0.35"/>
    <rect y="32" width="210" height="12" fill="#7C3AED" opacity="0.35"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Inside</text>

    <text x="22" y="64" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">30,000 unique prompts</text>
    <text x="22" y="84" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Multiple art styles</text>
    <text x="22" y="104" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Optimized for v5 &amp; v6</text>
    <text x="22" y="124" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Detailed parameters</text>
    <text x="22" y="144" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Organized by category</text>

    <rect x="16" y="156" width="178" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="178" font-family="Arial,sans-serif" font-size="8" fill="#C4B5FD" text-anchor="middle">Commercial Use · Full PLR Rights</text>
  </g>
</svg>
