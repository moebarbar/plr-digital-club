    <rect x="44" y="66" width="16" height="28" rx="2" fill="#93C5FD" opacity="0.4"/>
    <rect x="68" y="48" width="16" height="46" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="92" y="58" width="16" height="36" rx="2" fill="#93C5FD" opacity="0.4"/>
    <rect x="116" y="44" width="16" height="50" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="140" y="60" width="16" height="34" rx="2" fill="#93C5FD" opacity="0.4"/>
    <rect x="164" y="52" width="16" height="42" rx="2" fill="#93C5FD" opacity="0.4"/>
    <rect x="20" y="94" width="175" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="110" y="110" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Fully Editable · Resell Rights</text>
