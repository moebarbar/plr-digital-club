    <text x="70" y="58" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Insert</text>
    <text x="110" y="58" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Design</text>
