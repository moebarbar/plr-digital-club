    <text x="378" y="202" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Innovation</text>
    <rect x="340" y="210" width="76" height="3" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="340" y="218" width="60" height="3" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="340" y="226" width="50" height="3" rx="2" fill="#ffffff" opacity="0.2"/>
