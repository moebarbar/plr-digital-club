<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EFF6FF;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="80" r="120" fill="#ffffff" opacity="0.04"/>
  <circle cx="80" cy="420" r="100" fill="#ffffff" opacity="0.04"/>
  <circle cx="400" cy="250" r="300" fill="#ffffff" opacity="0.02"/>

  <!-- Left: Planner book illustration -->
  <g transform="translate(110, 120)" filter="url(#shadow)">
    <!-- Book spine -->
    <rect x="0" y="0" width="22" height="260" rx="4" fill="#0D47A1"/>
    <!-- Book cover -->
    <rect x="20" y="0" width="175" height="260" rx="6" fill="url(#card1)"/>
    <!-- Book rings -->
    <circle cx="11" cy="50" r="7" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <circle cx="11" cy="90" r="7" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <circle cx="11" cy="130" r="7" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <circle cx="11" cy="170" r="7" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <circle cx="11" cy="210" r="7" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <!-- Header stripe -->
    <rect x="20" y="0" width="175" height="52" rx="6" fill="#1A1A4E"/>
    <rect x="20" y="46" width="175" height="6" fill="#1A1A4E"/>
    <!-- Month label -->
    <text x="107" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">APRIL 2026</text>
    <!-- Day grid -->
    <rect x="34" y="66" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="64" y="66" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="94" y="66" width="24" height="24" rx="3" fill="#1565C0"/>
    <rect x="124" y="66" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="154" y="66" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="34" y="96" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="64" y="96" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="94" y="96" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="124" y="96" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <rect x="154" y="96" width="24" height="24" rx="3" fill="#EFF6FF"/>
    <!-- Numbers in grid -->
    <text x="46" y="83" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle">1</text>
    <text x="76" y="83" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle">2</text>
    <text x="106" y="83" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
    <text x="136" y="83" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle">4</text>
    <text x="166" y="83" font-family="Arial,sans-serif" font-size="10" fill="#1A1A4E" text-anchor="middle">5</text>
    <!-- Task lines -->
    <rect x="34" y="138" width="140" height="3" rx="2" fill="#E2E8F0"/>
    <rect x="34" y="150" width="110" height="3" rx="2" fill="#E2E8F0"/>
    <rect x="34" y="162" width="125" height="3" rx="2" fill="#E2E8F0"/>
    <rect x="34" y="174" width="90" height="3" rx="2" fill="#1565C0" opacity="0.5"/>
    <!-- Checkboxes -->
    <rect x="34" y="195" width="12" height="12" rx="2" fill="none" stroke="#1565C0" stroke-width="1.5"/>
    <rect x="34" y="213" width="12" height="12" rx="2" fill="#1565C0"/>
    <path d="M37 219 L40 222 L44 217" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="34" y="231" width="12" height="12" rx="2" fill="none" stroke="#1565C0" stroke-width="1.5"/>
    <rect x="52" y="198" width="90" height="3" rx="2" fill="#E2E8F0"/>
    <rect x="52" y="216" width="70" height="3" rx="2" fill="#E2E8F0"/>
    <rect x="52" y="234" width="80" height="3" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Right: Journal illustration -->
  <g transform="translate(340, 150)" filter="url(#shadow)">
    <!-- Journal cover -->
    <rect x="0" y="0" width="160" height="210" rx="8" fill="#1565C0"/>
    <!-- Journal spine detail -->
    <rect x="0" y="0" width="16" height="210" rx="4" fill="#0D47A1"/>
    <!-- Elastic band -->
    <rect x="130" y="0" width="4" height="210" rx="2" fill="#FCD34D"/>
    <!-- Journal label -->
    <rect x="25" y="55" width="115" height="100" rx="6" fill="#ffffff" opacity="0.12"/>
    <!-- Journal icon -->
    <text x="82" y="95" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#ffffff">✦</text>
    <text x="82" y="125" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9" font-weight="bold">MY JOURNAL</text>
    <!-- Corner bookmark -->
    <polygon points="135,0 160,0 160,30" fill="#FCD34D" opacity="0.9"/>
    <!-- Lines on cover -->
    <rect x="25" y="170" width="115" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
    <rect x="25" y="180" width="85" height="2" rx="1" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Third: Goals card -->
  <g transform="translate(540, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="155" height="200" rx="8" fill="#ffffff"/>
    <rect x="0" y="0" width="155" height="40" rx="8" fill="#1A1A4E"/>
    <rect x="0" y="32" width="155" height="8" fill="#1A1A4E"/>
    <text x="77" y="25" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GOALS TRACKER</text>
    <!-- Goal items with progress -->
    <text x="16" y="68" font-family="Arial,sans-serif" font-size="9" fill="#6B7280">Goal 1</text>
    <rect x="16" y="74" width="123" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="74" width="90" height="6" rx="3" fill="#1565C0"/>
    <text x="16" y="100" font-family="Arial,sans-serif" font-size="9" fill="#6B7280">Goal 2</text>
    <rect x="16" y="106" width="123" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="106" width="55" height="6" rx="3" fill="#1565C0"/>
    <text x="16" y="132" font-family="Arial,sans-serif" font-size="9" fill="#6B7280">Goal 3</text>
    <rect x="16" y="138" width="123" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="138" width="110" height="6" rx="3" fill="#22C55E"/>
    <!-- Star rating -->
    <text x="77" y="172" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#FCD34D">★★★★★</text>
    <text x="77" y="192" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#9CA3AF">Productivity Score</text>
  </g>

  <!-- Main label -->
  <text x="400" y="408" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Planners &amp; Journals</text>
  <text x="400" y="438" font-family="Arial,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle">Digital Planning · Goal Setting · Journaling</text>

  <!-- Badge -->
  <rect x="310" y="456" width="180" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
  <text x="400" y="475" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
