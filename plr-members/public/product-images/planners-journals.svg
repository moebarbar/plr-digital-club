    <circle cx="132" cy="110" r="5" fill="#1565C0"/>
    <circle cx="146" cy="110" r="5" fill="#1565C0"/>
    <circle cx="160" cy="110" r="5" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="174" cy="110" r="5" fill="#1565C0"/>
    <circle cx="188" cy="110" r="5" fill="#1565C0"/>

