    <circle cx="132" cy="162" r="5" fill="#1565C0"/>
    <circle cx="146" cy="162" r="5" fill="#1565C0"/>
    <circle cx="160" cy="162" r="5" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="174" cy="162" r="5" fill="#1565C0"/>
    <circle cx="188" cy="162" r="5" fill="#1565C0"/>

    <rect x="16" y="174" width="168" height="1" fill="#F3F4F6"/>
    <text x="20" y="192" font-family="Arial,sans-serif" font-size="9" fill="#374151">✍️ Journal</text>
    <circle cx="104" cy="188" r="5" fill="#93C5FD"/>
    <circle cx="118" cy="188" r="5" fill="#93C5FD"/>
    <circle cx="132" cy="188" r="5" fill="#93C5FD"/>
    <circle cx="146" cy="188" r="5" fill="#93C5FD"/>
    <circle cx="160" cy="188" r="5" fill="#93C5FD"/>
    <circle cx="174" cy="188" r="5" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
