    <text x="144" y="94" font-family="Arial,sans-serif" font-size="10" fill="#374151" text-anchor="middle">5</text>
    <text x="174" y="94" font-family="Arial,sans-serif" font-size="10" fill="#374151" text-anchor="middle">6</text>
