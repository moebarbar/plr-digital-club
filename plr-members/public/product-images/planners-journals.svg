    <circle cx="118" cy="136" r="5" fill="#93C5FD"/>
    <circle cx="132" cy="136" r="5" fill="#93C5FD"/>
    <circle cx="146" cy="136" r="5" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="160" cy="136" r="5" fill="#93C5FD"/>
    <circle cx="174" cy="136" r="5" fill="#93C5FD"/>
    <circle cx="188" cy="136" r="5" fill="#93C5FD"/>

