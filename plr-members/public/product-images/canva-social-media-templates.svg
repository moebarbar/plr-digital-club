<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#EFF6FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="130" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="440" r="110" fill="#ffffff" opacity="0.03"/>

  <!-- Instagram-style post card -->
  <g transform="translate(80, 90)" filter="url(#shadow)">
    <rect width="170" height="200" rx="12" fill="#ffffff"/>
    <!-- Image area -->
    <rect width="170" height="130" rx="12" fill="#1A1A4E"/>
    <rect y="118" width="170" height="12" fill="#1A1A4E"/>
    <!-- Abstract design in image -->
    <circle cx="85" cy="65" r="35" fill="#1565C0" opacity="0.6"/>
    <circle cx="85" cy="65" r="22" fill="#ffffff" opacity="0.15"/>
    <rect x="30" y="100" width="110" height="3" rx="2" fill="#ffffff" opacity="0.3"/>
    <!-- IG header -->
    <circle cx="16" cy="145" r="8" fill="#E5E7EB"/>
    <rect x="30" y="141" width="60" height="4" rx="2" fill="#D1D5DB"/>
    <rect x="30" y="149" width="40" height="3" rx="2" fill="#E5E7EB"/>
    <!-- IG actions -->
    <text x="12" y="172" font-family="Arial,sans-serif" font-size="14" fill="#374151">♡</text>
    <text x="32" y="172" font-family="Arial,sans-serif" font-size="14" fill="#374151">✉</text>
    <rect x="12" y="178" width="90" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="12" y="186" width="70" height="3" rx="2" fill="#F3F4F6"/>
    <!-- IG label -->
    <rect x="130" y="136" width="30" height="14" rx="7" fill="#E1306C"/>
    <text x="145" y="147" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">IG</text>
  </g>

  <!-- Facebook-style card -->
  <g transform="translate(278, 70)" filter="url(#shadow)">
    <rect width="195" height="220" rx="12" fill="#ffffff"/>
    <!-- FB top bar -->
    <rect width="195" height="36" rx="12" fill="#1877F2"/>
    <rect y="24" width="195" height="12" fill="#1877F2"/>
    <text x="97" y="23" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Facebook Post</text>
    <!-- User row -->
    <circle cx="22" cy="56" r="12" fill="#E5E7EB"/>
    <rect x="40" y="49" width="70" height="5" rx="2" fill="#D1D5DB"/>
    <rect x="40" y="58" width="50" height="4" rx="2" fill="#E5E7EB"/>
    <!-- Image area -->
    <rect x="12" y="76" width="171" height="95" rx="8" fill="#EFF6FF"/>
    <!-- Abstract graphic -->
    <rect x="30" y="90" width="135" height="4" rx="2" fill="#1565C0" opacity="0.4"/>
    <rect x="50" y="100" width="95" height="4" rx="2" fill="#1A1A4E" opacity="0.3"/>
    <rect x="40" y="110" width="115" height="4" rx="2" fill="#1565C0" opacity="0.4"/>
    <circle cx="97" cy="130" r="18" fill="#1565C0" opacity="0.15"/>
    <text x="97" y="135" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#1565C0">f</text>
    <!-- Engagement bar -->
    <rect x="12" y="180" width="171" height="1" fill="#E5E7EB"/>
    <rect x="12" y="188" width="50" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="80" y="188" width="40" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="138" y="188" width="45" height="4" rx="2" fill="#E5E7EB"/>
    <!-- Label -->
    <rect x="140" y="44" width="42" height="16" rx="8" fill="#1877F2"/>
    <text x="161" y="56" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">FB</text>
  </g>

  <!-- Twitter/X-style card -->
  <g transform="translate(505, 100)" filter="url(#shadow)">
    <rect width="175" height="185" rx="12" fill="#ffffff"/>
    <!-- X header -->
    <rect width="175" height="32" rx="12" fill="#000000"/>
    <rect y="20" width="175" height="12" fill="#000000"/>
    <text x="87" y="21" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">𝕏 Post</text>
    <!-- User row -->
    <circle cx="20" cy="50" r="10" fill="#E5E7EB"/>
    <rect x="36" y="44" width="60" height="4" rx="2" fill="#D1D5DB"/>
    <rect x="36" y="52" width="40" height="3" rx="2" fill="#E5E7EB"/>
    <!-- Tweet content lines -->
    <rect x="12" y="68" width="150" height="4" rx="2" fill="#374151" opacity="0.7"/>
    <rect x="12" y="78" width="120" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <rect x="12" y="88" width="135" height="4" rx="2" fill="#374151" opacity="0.5"/>
    <!-- Image thumbnail -->
    <rect x="12" y="102" width="150" height="50" rx="6" fill="#EFF6FF"/>
    <circle cx="87" cy="127" r="14" fill="#1565C0" opacity="0.2"/>
    <text x="87" y="132" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1565C0">✦</text>
    <!-- Actions -->
    <text x="18" y="172" font-family="Arial,sans-serif" font-size="11" fill="#6B7280">♡  ↺  ↑</text>
  </g>

  <!-- Small TikTok card -->
  <g transform="translate(115, 310)" filter="url(#shadow)">
    <rect width="100" height="140" rx="10" fill="#000000"/>
    <rect x="8" y="8" width="84" height="90" rx="6" fill="#1A1A4E"/>
    <circle cx="50" cy="53" r="20" fill="#ffffff" opacity="0.08"/>
    <circle cx="50" cy="53" r="10" fill="#ffffff" opacity="0.15"/>
    <text x="50" y="58" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">▶</text>
    <rect x="8" y="104" width="50" height="3" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="8" y="112" width="35" height="3" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="72" y="100" width="20" height="20" rx="10" fill="#FF0050"/>
    <text x="82" y="114" font-family="Arial,sans-serif" font-size="9" text-anchor="middle" fill="#ffffff" font-weight="bold">TK</text>
    <rect x="8" y="122" width="84" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="50" y="135" font-family="Arial,sans-serif" font-size="8" text-anchor="middle" fill="#ffffff" opacity="0.5">TikTok</text>
  </g>

  <!-- Pinterest card -->
  <g transform="translate(245, 305)" filter="url(#shadow)">
    <rect width="100" height="145" rx="10" fill="#ffffff"/>
    <rect width="100" height="90" rx="10" fill="#E60023"/>
    <rect y="80" width="100" height="10" fill="#E60023"/>
    <text x="50" y="50" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#ffffff">P</text>
    <rect x="10" y="100" width="80" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="10" y="110" width="60" height="3" rx="2" fill="#F3F4F6"/>
    <rect x="10" y="120" width="70" height="3" rx="2" fill="#F3F4F6"/>
    <rect x="25" y="132" width="50" height="6" rx="3" fill="#E60023"/>
    <text x="50" y="138" font-family="Arial,sans-serif" font-size="7" text-anchor="middle" fill="#ffffff" font-weight="bold">Save</text>
  </g>

  <!-- Main label -->
  <text x="400" y="408" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Canva Social Media Templates</text>
  <text x="400" y="438" font-family="Arial,sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">Instagram · Facebook · X · TikTok · Pinterest</text>

  <!-- Badge -->
  <rect x="310" y="455" width="180" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="400" y="474" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
