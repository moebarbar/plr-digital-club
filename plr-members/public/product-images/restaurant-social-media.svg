    <text x="235" y="23" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Template Preview Collection</text>

    <!-- Template 1 - Menu post -->
    <rect x="14" y="50" width="108" height="80" rx="8" fill="#7F1D1D"/>
    <rect x="14" y="50" width="108" height="80" rx="8" fill="none" stroke="#DC2626" stroke-width="1"/>
    <text x="68" y="82" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">🍕</text>
    <text x="68" y="100" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="bold">Daily Special</text>
    <text x="68" y="118" font-family="Arial,sans-serif" font-size="6" fill="#FCA5A5" text-anchor="middle">Menu Post</text>

