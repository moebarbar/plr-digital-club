<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400E"/>
      <stop offset="100%" style="stop-color:#DC2626"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Hero panel -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="470" height="130" rx="12" fill="#0D1B3E"/>
    <rect width="470" height="130" rx="12" fill="none" stroke="#DC2626" stroke-width="1" opacity="0.5"/>
    <!-- Badge -->
    <rect x="16" y="18" width="96" height="22" rx="11" fill="url(#warm)"/>
    <text x="64" y="33" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">🍽️ RESTAURANT KIT</text>
    <!-- Title -->
    <text x="16" y="70" font-family="Georgia,serif" font-size="20" fill="#ffffff" font-weight="bold">Restaurant Social Media</text>
    <text x="16" y="92" font-family="Georgia,serif" font-size="20" fill="#FCA5A5" font-weight="bold">Canva Collection</text>
    <rect x="16" y="104" width="220" height="2" fill="#DC2626"/>
    <text x="16" y="121" font-family="Arial,sans-serif" font-size="8" fill="#6B7280">Menus · Promotions · Events · Daily Specials</text>
    <!-- Icon -->
    <circle cx="415" cy="65" r="50" fill="#DC2626" opacity="0.08"/>
    <circle cx="415" cy="65" r="30" fill="#DC2626" opacity="0.1"/>
    <text x="415" y="77" font-family="Arial,sans-serif" font-size="32" text-anchor="middle">🍽️</text>
  </g>

  <!-- Template preview grid -->
  <g transform="translate(55, 188)" filter="url(#shadow2)">
