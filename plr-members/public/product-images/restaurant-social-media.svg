  <g transform="translate(548, 234)" filter="url(#shadow2)">
    <rect width="210" height="196" rx="12" fill="#0D1B3E"/>
    <rect width="210" height="44" rx="12" fill="#DC2626" opacity="0.3"/>
    <rect y="32" width="210" height="12" fill="#DC2626" opacity="0.3"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Included</text>

    <text x="22" y="64" font-family="Arial,sans-serif" font-size="10" fill="#FCA5A5">✓</text>
    <text x="40" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Canva-ready templates</text>
    <text x="22" y="84" font-family="Arial,sans-serif" font-size="10" fill="#FCA5A5">✓</text>
    <text x="40" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Posts, stories &amp; banners</text>
    <text x="22" y="104" font-family="Arial,sans-serif" font-size="10" fill="#FCA5A5">✓</text>
    <text x="40" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Menu &amp; promo designs</text>
    <text x="22" y="124" font-family="Arial,sans-serif" font-size="10" fill="#FCA5A5">✓</text>
    <text x="40" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Fully editable &amp; brandable</text>
    <text x="22" y="144" font-family="Arial,sans-serif" font-size="10" fill="#FCA5A5">✓</text>
    <text x="40" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Multi-platform formats</text>

    <rect x="16" y="156" width="178" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="178" font-family="Arial,sans-serif" font-size="8" fill="#FCA5A5" text-anchor="middle">Full PLR · Rebrand &amp; Resell</text>
  </g>
</svg>
