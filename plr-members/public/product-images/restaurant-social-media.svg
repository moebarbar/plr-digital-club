    <text x="163" y="120" font-family="Arial,sans-serif" font-size="5" fill="#FCD34D" text-anchor="middle">Instagram</text>
    <text x="163" y="148" font-family="Arial,sans-serif" font-size="5" fill="#9CA3AF" text-anchor="middle">9:16</text>

