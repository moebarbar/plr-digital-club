    <text x="57" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Menu Posts</text>

    <rect x="110" y="56" width="86" height="44" rx="6" fill="#FEF2F2"/>
    <text x="153" y="74" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🎉</text>
    <text x="153" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Promotions</text>

    <rect x="14" y="108" width="86" height="44" rx="6" fill="#FEF2F2"/>
    <text x="57" y="126" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">📅</text>
    <text x="57" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Events</text>

    <rect x="110" y="108" width="86" height="44" rx="6" fill="#FEF2F2"/>
    <text x="153" y="126" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">⭐</text>
    <text x="153" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Daily Specials</text>
