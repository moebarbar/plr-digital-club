<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Photoshop brush panel mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="340" height="370" rx="12" fill="#2B2B2B"/>
    <!-- Title bar -->
    <rect width="340" height="34" rx="12" fill="#1E1E1E"/>
    <rect y="22" width="340" height="12" fill="#1E1E1E"/>
    <circle cx="18" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="34" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="17" r="5" fill="#28CA41"/>
    <text x="170" y="22" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Brush Settings — Adobe Photoshop</text>

    <!-- Brush panel header -->
    <rect x="0" y="34" width="340" height="28" fill="#252525"/>
    <text x="20" y="52" font-family="Arial,sans-serif" font-size="9" fill="#BBBBBB" font-weight="bold">Brushes</text>
    <text x="300" y="52" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="end">+ New</text>

    <!-- Brush grid -->
    <!-- Row 1 - varying brush strokes -->
    <rect x="10" y="68" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <ellipse cx="42" cy="90" rx="20" ry="8" fill="#ffffff" opacity="0.7"/>
    <text x="42" y="110" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Soft Round</text>

    <rect x="80" y="68" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <ellipse cx="112" cy="90" rx="14" ry="14" fill="#ffffff" opacity="0.6"/>
    <text x="112" y="110" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Hard Round</text>

    <rect x="150" y="68" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Splatter brush preview -->
    <circle cx="178" cy="86" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="185" cy="80" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="170" cy="82" r="2.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="182" cy="94" r="1.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="172" cy="95" r="2" fill="#ffffff" opacity="0.4"/>
    <circle cx="188" cy="90" r="1" fill="#ffffff" opacity="0.3"/>
    <text x="182" y="110" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Splatter</text>

    <rect x="220" y="68" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Watercolor brush preview -->
    <ellipse cx="252" cy="87" rx="18" ry="10" fill="#93C5FD" opacity="0.3"/>
    <ellipse cx="255" cy="90" rx="12" ry="7" fill="#1565C0" opacity="0.2"/>
    <text x="252" y="110" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Watercolor</text>

    <rect x="290" y="68" width="40" height="50" rx="4" fill="#1E1E1E"/>
    <text x="310" y="88" font-family="Arial,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">···</text>
    <text x="310" y="102" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">More</text>

    <!-- Row 2 -->
    <rect x="10" y="124" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Chalk brush -->
    <line x1="26" y1="150" x2="60" y2="140" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <line x1="26" y1="150" x2="60" y2="140" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="2 3"/>
    <text x="42" y="166" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Chalk</text>

    <rect x="80" y="124" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Ink brush -->
    <path d="M94,155 Q106,135 120,148 Q112,160 94,155" fill="#ffffff" opacity="0.5"/>
    <text x="112" y="166" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Ink Pen</text>

    <rect x="150" y="124" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Stars brush -->
    <text x="182" y="152" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#93C5FD" opacity="0.6">✦</text>
    <text x="182" y="166" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Stars</text>

    <rect x="220" y="124" width="64" height="50" rx="4" fill="#1E1E1E"/>
    <!-- Grunge brush -->
    <rect x="228" y="136" width="48" height="16" rx="2" fill="#ffffff" opacity="0.08"/>
    <rect x="230" y="140" width="40" height="8" rx="1" fill="#ffffff" opacity="0.15"/>
    <text x="252" y="166" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Grunge</text>

    <!-- Canvas preview area -->
    <rect x="10" y="184" width="320" height="170" rx="6" fill="#1A1A1A"/>
    <!-- Brush strokes on canvas -->
    <ellipse cx="80" cy="240" rx="50" ry="22" fill="#1565C0" opacity="0.25"/>
    <ellipse cx="80" cy="240" rx="35" ry="14" fill="#1565C0" opacity="0.35"/>
    <!-- Flowing ink stroke -->
    <path d="M60,280 Q120,255 180,270 Q240,285 280,265" fill="none" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
    <path d="M60,280 Q120,255 180,270 Q240,285 280,265" fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Splatter dots -->
    <circle cx="200" cy="220" r="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="215" cy="212" r="2.5" fill="#ffffff" opacity="0.15"/>
    <circle cx="190" cy="230" r="3" fill="#ffffff" opacity="0.18"/>
    <circle cx="222" cy="228" r="2" fill="#ffffff" opacity="0.12"/>
    <!-- Bottom status -->
    <text x="170" y="348" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">Canvas Preview · Brush: Soft Round 45px · Opacity 80%</text>
  </g>

  <!-- Right panels -->
  <g transform="translate(418, 42)" filter="url(#shadow2)">
    <rect width="330" height="155" rx="12" fill="#ffffff"/>
    <rect width="330" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="330" height="12" fill="#1A1A4E"/>
    <text x="165" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Brush Categories</text>

    <rect x="14" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="49" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🎨</text>
    <text x="49" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Watercolor</text>

    <rect x="92" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="127" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">✏️</text>
    <text x="127" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Sketching</text>

    <rect x="170" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="205" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💥</text>
    <text x="205" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Grunge &amp; Splat</text>

    <rect x="248" y="56" width="68" height="40" rx="6" fill="#EFF6FF"/>
    <text x="282" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🌿</text>
    <text x="282" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Nature</text>

    <rect x="14" y="108" width="302" height="30" rx="6" fill="#1A1A4E"/>
    <text x="165" y="121" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle" font-weight="bold">Ink · Chalk · Stars · Fog · Texture · Hair + More</text>
    <text x="165" y="132" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.6">Hundreds of brush styles included</text>
  </g>

  <g transform="translate(418, 214)" filter="url(#shadow2)">
    <rect width="330" height="200" rx="12" fill="#1A1A4E"/>
    <rect width="330" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="330" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="165" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Included</text>

    <text x="28" y="64" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Hundreds of .ABR brush files</text>
    <text x="28" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Works with PS CS4+ and all CC versions</text>
    <text x="28" y="104" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Watercolor, ink, grunge, nature &amp; more</text>
    <text x="28" y="124" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">High resolution for print quality work</text>
    <text x="28" y="144" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Commercial use &amp; full resell rights</text>

    <rect x="18" y="158" width="294" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="165" y="182" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD" text-anchor="middle">.ABR Format · Instant Download · PLR Rights</text>
  </g>

  <!-- Label -->
  <text x="400" y="452" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Photoshop Brushes</text>
  <text x="400" y="474" font-family="Arial,sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">Watercolor · Ink · Grunge · Nature · Texture</text>
  <rect x="275" y="482" width="250" height="14" rx="7" fill="#ffffff" opacity="0.1"/>
</svg>
