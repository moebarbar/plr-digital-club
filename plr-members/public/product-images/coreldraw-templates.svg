    <!-- Design canvas -->
    <rect x="76" y="80" width="252" height="256" rx="2" fill="#CCCCCC"/>
    <rect x="80" y="84" width="244" height="248" rx="2" fill="#ffffff"/>
    <!-- Template design on canvas -->
    <!-- Business card preview -->
    <rect x="96" y="104" width="212" height="120" rx="4" fill="#1A1A4E"/>
    <rect x="96" y="104" width="8" height="120" rx="2" fill="#1565C0"/>
