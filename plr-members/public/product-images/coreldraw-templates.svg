    <text x="380" y="96" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Fill Color</text>
    <circle cx="456" cy="93" r="7" fill="#1A1A4E"/>
    <text x="380" y="112" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Outline</text>
    <rect x="420" y="106" width="32" height="8" rx="2" fill="#1565C0"/>
    <text x="380" y="128" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Width</text>
    <rect x="408" y="120" width="56" height="8" rx="2" fill="#3C3C3C"/>
