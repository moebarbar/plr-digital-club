    <text x="16" y="76" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">↖</text>
    <text x="16" y="96" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🔲</text>
    <text x="16" y="116" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">⭕</text>
    <text x="16" y="136" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">✏️</text>
    <text x="16" y="156" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#BBBBBB">T</text>
    <text x="16" y="176" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🪣</text>
    <text x="16" y="196" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">✂️</text>

