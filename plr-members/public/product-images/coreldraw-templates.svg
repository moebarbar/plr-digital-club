<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- CorelDraw window mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="480" height="360" rx="12" fill="#2A2A2A"/>
    <!-- Title bar -->
    <rect width="480" height="34" rx="12" fill="#1E1E1E"/>
    <rect y="22" width="480" height="12" fill="#1E1E1E"/>
    <circle cx="18" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="34" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="17" r="5" fill="#28CA41"/>
    <text x="240" y="22" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">CorelDRAW — Business Card Template.cdr</text>

    <!-- Menu bar -->
    <rect x="0" y="34" width="480" height="22" fill="#2E2E2E"/>
    <text x="16" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">File</text>
    <text x="38" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">Edit</text>
    <text x="58" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">View</text>
    <text x="80" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">Layout</text>
    <text x="106" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">Object</text>
    <text x="134" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">Text</text>
    <text x="154" y="49" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">Tools</text>

    <!-- Toolbox left -->
