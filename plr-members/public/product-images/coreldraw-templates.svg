    <rect x="115" y="160" width="110" height="1" fill="#1565C0" opacity="0.4"/>
    <text x="200" y="174" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF" text-anchor="middle">email@company.com · +1 555 0000</text>
    <text x="200" y="186" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF" text-anchor="middle">www.yourwebsite.com</text>
    <!-- Guidelines -->
    <line x1="96" y1="80" x2="96" y2="332" stroke="#93C5FD" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="308" y1="80" x2="308" y2="332" stroke="#93C5FD" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="80" y1="104" x2="324" y2="104" stroke="#93C5FD" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="80" y1="224" x2="324" y2="224" stroke="#93C5FD" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

