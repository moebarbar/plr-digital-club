    <text x="380" y="144" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">Height</text>
    <rect x="408" y="136" width="56" height="8" rx="2" fill="#3C3C3C"/>
    <text x="411" y="143" font-family="Arial,sans-serif" font-size="6" fill="#BBBBBB">55 mm</text>
