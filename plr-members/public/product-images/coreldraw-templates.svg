    <rect x="12" y="56" width="82" height="44" rx="6" fill="#EFF6FF"/>
    <text x="53" y="74" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🪪</text>
    <text x="53" y="89" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Business Cards</text>

    <rect x="106" y="56" width="82" height="44" rx="6" fill="#EFF6FF"/>
    <text x="147" y="74" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">📰</text>
    <text x="147" y="89" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Flyers</text>

    <rect x="12" y="108" width="82" height="44" rx="6" fill="#EFF6FF"/>
    <text x="53" y="126" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🏷️</text>
    <text x="53" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Labels</text>

    <rect x="106" y="108" width="82" height="44" rx="6" fill="#EFF6FF"/>
    <text x="147" y="126" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🖼️</text>
    <text x="147" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Banners</text>
  </g>

  <g transform="translate(558, 224)" filter="url(#shadow2)">
    <rect width="200" height="178" rx="12" fill="#1A1A4E"/>
    <rect width="200" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="200" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="100" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Included Formats</text>

    <text x="22" y="64" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">CorelDRAW .CDR files</text>
    <text x="22" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Adobe Illustrator .AI</text>
    <text x="22" y="104" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">PDF · EPS formats</text>
    <text x="22" y="124" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Fully editable vectors</text>
    <text x="22" y="144" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="40" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">CMYK print-ready</text>

    <rect x="16" y="155" width="168" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="100" y="172" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Commercial Use · PLR Rights</text>
  </g>
