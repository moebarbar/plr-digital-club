    <rect x="380" y="166" width="92" height="1" fill="#3C3C3C"/>
    <rect x="380" y="170" width="92" height="18" rx="2" fill="#3C3C3C"/>
    <text x="390" y="182" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD">🔒 Background</text>
    <rect x="380" y="192" width="92" height="18" rx="2" fill="#1565C0" opacity="0.3"/>
    <text x="390" y="204" font-family="Arial,sans-serif" font-size="6" fill="#93C5FD">✏️ Design Layer</text>
    <rect x="380" y="214" width="92" height="18" rx="2" fill="#3C3C3C"/>
    <text x="390" y="226" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF">T  Text Layer</text>
    <text x="426" y="340" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">.CDR · .AI · .PDF</text>

    <!-- Status bar -->
    <rect x="32" y="350" width="448" height="10" fill="#1E1E1E"/>
    <text x="44" y="358" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">Ready · Page 1 of 1 · Units: mm</text>
    <text x="460" y="358" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="end">Zoom: 85%</text>
