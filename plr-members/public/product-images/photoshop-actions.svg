<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Photoshop window mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="460" height="350" rx="12" fill="#2B2B2B"/>
    <!-- Title bar -->
    <rect width="460" height="34" rx="12" fill="#1E1E1E"/>
    <rect y="22" width="460" height="12" fill="#1E1E1E"/>
    <circle cx="18" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="34" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="17" r="5" fill="#28CA41"/>
    <text x="230" y="22" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Adobe Photoshop — portrait.psd</text>

    <!-- Toolbar left -->
    <rect x="0" y="34" width="38" height="316" rx="0" fill="#252525"/>
    <text x="19" y="56" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">↖</text>
    <text x="19" y="76" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">✏️</text>
    <text x="19" y="98" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🔲</text>
    <text x="19" y="120" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🪣</text>
    <text x="19" y="142" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#9CA3AF">🔍</text>

    <!-- Canvas area -->
    <rect x="38" y="34" width="320" height="316" fill="#3C3C3C"/>
    <!-- Image preview (simulated) -->
    <rect x="80" y="62" width="240" height="260" rx="2" fill="#1A1A4E"/>
    <!-- Photo effect overlay - simulating a stylized photo -->
    <rect x="80" y="62" width="240" height="260" rx="2" fill="#1565C0" opacity="0.2"/>
    <!-- Simulated portrait silhouette -->
    <ellipse cx="200" cy="140" rx="45" ry="50" fill="#1565C0" opacity="0.3"/>
    <rect x="155" y="185" width="90" height="120" rx="10" fill="#1565C0" opacity="0.25"/>
    <!-- Effect label overlay -->
    <rect x="86" y="290" width="228" height="24" rx="3" fill="#000000" opacity="0.6"/>
    <text x="200" y="305" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle" font-weight="bold">CINEMATIC BLUE TONE · Action Applied</text>

    <!-- Right panel - Actions panel -->
    <rect x="358" y="34" width="102" height="316" fill="#252525"/>
    <text x="409" y="54" font-family="Arial,sans-serif" font-size="8" fill="#BBBBBB" text-anchor="middle" font-weight="bold">Actions</text>
    <rect x="364" y="60" width="90" height="1" fill="#3C3C3C"/>

    <!-- Action items -->
    <rect x="364" y="66" width="90" height="22" rx="2" fill="#1565C0" opacity="0.4"/>
    <text x="374" y="80" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD">▶ Cinematic Blue</text>

    <rect x="364" y="92" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="106" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ Matte Vintage</text>

    <rect x="364" y="118" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="132" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ Soft Glow</text>

    <rect x="364" y="144" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="158" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ HDR Punch</text>

    <rect x="364" y="170" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="184" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ B&amp;W Drama</text>

    <rect x="364" y="196" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="210" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ Oil Paint</text>

    <rect x="364" y="222" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="236" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ Watercolor</text>

    <rect x="364" y="248" width="90" height="22" rx="2" fill="#3C3C3C"/>
    <text x="374" y="262" font-family="Arial,sans-serif" font-size="7" fill="#BBBBBB">▶ Pencil Sketch</text>

    <text x="409" y="290" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">30,000+ actions</text>

    <!-- Bottom status bar -->
    <rect x="38" y="340" width="320" height="10" fill="#1E1E1E"/>
    <text x="48" y="348" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">100% · RGB/8 · 300 DPI · Unsaved</text>
  </g>

  <!-- Right info panels -->
  <g transform="translate(538, 42)" filter="url(#shadow2)">
    <rect width="210" height="155" rx="12" fill="#ffffff"/>
    <rect width="210" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="210" height="12" fill="#1A1A4E"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">30,000+ Actions</text>

    <rect x="14" y="56" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="57" y="74" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🎨</text>
    <text x="57" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Photo Effects</text>

    <rect x="110" y="56" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="153" y="74" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">✨</text>
    <text x="153" y="90" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Auto Enhance</text>

    <rect x="14" y="108" width="86" height="34" rx="6" fill="#EFF6FF"/>
    <text x="57" y="130" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">🖌️ Artistic</text>

    <rect x="110" y="108" width="86" height="34" rx="6" fill="#EFF6FF"/>
    <text x="153" y="130" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">📸 Portrait</text>
  </g>

  <g transform="translate(538, 214)" filter="url(#shadow2)">
    <rect width="210" height="178" rx="12" fill="#1565C0" opacity="0.12"/>
    <rect width="210" height="178" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="105" y="28" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Action Categories</text>
    <rect x="20" y="36" width="170" height="1" fill="#ffffff" opacity="0.15"/>
    <text x="28" y="58" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">📷 Photography Filters</text>
    <text x="28" y="78" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🎨 Artistic &amp; Painterly</text>
    <text x="28" y="98" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✨ Retouching &amp; Skin</text>
    <text x="28" y="118" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🌈 Color Grading</text>
    <text x="28" y="138" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">⚡ Batch Automation</text>
    <rect x="20" y="150" width="170" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="170" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.7">PS CS6+ · CC Compatible</text>
  </g>
</svg>
