    <rect width="86" height="330" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="43" y="32" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">Formats</text>
    <rect x="12" y="40" width="62" height="1" fill="#ffffff" opacity="0.15"/>
    <text x="43" y="64" font-family="Arial,sans-serif" font-size="22" fill="#93C5FD" text-anchor="middle" font-weight="bold">AI</text>
    <text x="43" y="80" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">EPS</text>
    <text x="43" y="96" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">PDF</text>
    <text x="43" y="112" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">PSD</text>
    <text x="43" y="128" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">DOCX</text>
