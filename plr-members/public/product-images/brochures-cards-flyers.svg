    <text x="43" y="164" font-family="Arial,sans-serif" font-size="20" fill="#93C5FD" text-anchor="middle" font-weight="bold">5K+</text>
    <text x="43" y="178" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.7">Templates</text>
    <rect x="12" y="190" width="62" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="43" y="212" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Editable</text>
    <text x="43" y="228" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Print</text>
    <text x="43" y="244" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Ready</text>
    <rect x="12" y="256" width="62" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="43" y="278" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">Full PLR</text>
    <text x="43" y="292" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle">Rights</text>
