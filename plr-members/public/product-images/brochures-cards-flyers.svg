    <rect x="193" y="0" width="1" height="200" fill="#E5E7EB"/>
    <!-- Panel 1 - Cover -->
    <rect width="96" height="200" rx="10" fill="#1A1A4E"/>
    <rect x="88" y="0" width="8" height="200" fill="#1A1A4E"/>
    <circle cx="48" cy="60" r="28" fill="#1565C0" opacity="0.4"/>
    <text x="48" y="50" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#93C5FD">🏢</text>
    <text x="48" y="100" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Your</text>
    <text x="48" y="114" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Business</text>
    <rect x="18" y="122" width="60" height="2" fill="#1565C0"/>
    <text x="48" y="136" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" text-anchor="middle" letter-spacing="1">COMPANY NAME</text>
    <!-- Panel 2 -->
    <rect x="96" y="12" width="97" height="20" rx="2" fill="#EFF6FF"/>
    <text x="144" y="26" font-family="Arial,sans-serif" font-size="8" fill="#1A1A4E" text-anchor="middle" font-weight="bold">About Us</text>
    <rect x="106" y="40" width="77" height="2" rx="1" fill="#E5E7EB"/>
    <rect x="106" y="48" width="70" height="2" rx="1" fill="#E5E7EB"/>
    <rect x="106" y="56" width="75" height="2" rx="1" fill="#E5E7EB"/>
    <rect x="106" y="64" width="65" height="2" rx="1" fill="#E5E7EB"/>
    <rect x="106" y="80" width="77" height="2" rx="1" fill="#E5E7EB"/>
    <rect x="106" y="88" width="60" height="2" rx="1" fill="#E5E7EB"/>
