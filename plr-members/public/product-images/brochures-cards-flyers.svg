  <rect x="195" y="452" width="330" height="22" rx="11" fill="#ffffff" opacity="0.1"/>
  <text x="360" y="468" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
