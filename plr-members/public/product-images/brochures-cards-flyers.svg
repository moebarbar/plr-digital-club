    <text x="237" y="26" font-family="Arial,sans-serif" font-size="8" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Services</text>
    <rect x="204" y="40" width="72" height="10" rx="4" fill="#EFF6FF"/>
    <text x="240" y="49" font-family="Arial,sans-serif" font-size="6" fill="#1565C0" text-anchor="middle">✓ Service One</text>
    <rect x="204" y="56" width="72" height="10" rx="4" fill="#EFF6FF"/>
    <text x="240" y="65" font-family="Arial,sans-serif" font-size="6" fill="#1565C0" text-anchor="middle">✓ Service Two</text>
    <rect x="204" y="72" width="72" height="10" rx="4" fill="#EFF6FF"/>
    <text x="240" y="81" font-family="Arial,sans-serif" font-size="6" fill="#1565C0" text-anchor="middle">✓ Service Three</text>
