<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- SVG element showcase cards -->
  <!-- Card 1 - Icons -->
  <g transform="translate(58, 42)" filter="url(#shadow)">
    <rect width="165" height="175" rx="12" fill="#ffffff"/>
    <rect width="165" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="165" height="12" fill="#1A1A4E"/>
    <text x="82" y="26" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Icon Sets</text>

    <!-- Icon grid -->
    <text x="36" y="80" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">⭐</text>
    <text x="82" y="80" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">🔷</text>
    <text x="128" y="80" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">🔶</text>
    <text x="36" y="116" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">⚡</text>
    <text x="82" y="116" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">◈</text>
    <text x="128" y="116" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">✦</text>
    <text x="82" y="155" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">500+ Icons</text>
    <text x="82" y="168" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR · Resell Rights</text>
  </g>

  <!-- Card 2 - Illustrations -->
  <g transform="translate(240, 42)" filter="url(#shadow)">
    <rect width="165" height="175" rx="12" fill="#EFF6FF"/>
    <rect width="165" height="44" rx="12" fill="#1565C0"/>
    <rect y="32" width="165" height="12" fill="#1565C0"/>
    <text x="82" y="26" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Illustrations</text>

    <!-- Abstract illustration elements -->
    <circle cx="82" cy="100" r="30" fill="#1A1A4E" opacity="0.1"/>
    <circle cx="82" cy="100" r="20" fill="#1565C0" opacity="0.15"/>
    <!-- Simple mountain landscape -->
    <polygon points="40,135 82,75 124,135" fill="#1A1A4E" opacity="0.15"/>
    <polygon points="55,135 82,90 109,135" fill="#1565C0" opacity="0.2"/>
    <circle cx="108" cy="88" r="12" fill="#93C5FD" opacity="0.3"/>
    <rect x="20" y="135" width="125" height="3" fill="#1A1A4E" opacity="0.1"/>
    <text x="82" y="155" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">300+ Illustrations</text>
    <text x="82" y="168" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR · Resell Rights</text>
  </g>

  <!-- Card 3 - Patterns -->
  <g transform="translate(422, 42)" filter="url(#shadow)">
    <rect width="165" height="175" rx="12" fill="#ffffff"/>
    <rect width="165" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="165" height="12" fill="#1A1A4E"/>
    <text x="82" y="26" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Patterns</text>

    <!-- Pattern preview area -->
    <rect x="12" y="52" width="141" height="100" rx="4" fill="#EFF6FF"/>
    <!-- Repeating pattern elements -->
    <circle cx="30" cy="72" r="5" fill="#1565C0" opacity="0.4"/>
    <circle cx="55" cy="72" r="5" fill="#1565C0" opacity="0.4"/>
    <circle cx="80" cy="72" r="5" fill="#1565C0" opacity="0.4"/>
    <circle cx="105" cy="72" r="5" fill="#1565C0" opacity="0.4"/>
    <circle cx="130" cy="72" r="5" fill="#1565C0" opacity="0.4"/>
    <circle cx="30" cy="92" r="5" fill="#1A1A4E" opacity="0.3"/>
    <circle cx="55" cy="92" r="5" fill="#1A1A4E" opacity="0.3"/>
    <circle cx="80" cy="92" r="5" fill="#1A1A4E" opacity="0.3"/>
    <circle cx="105" cy="92" r="5" fill="#1A1A4E" opacity="0.3"/>
    <circle cx="130" cy="92" r="5" fill="#1A1A4E" opacity="0.3"/>
    <circle cx="30" cy="112" r="5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="55" cy="112" r="5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="80" cy="112" r="5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="105" cy="112" r="5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="130" cy="112" r="5" fill="#93C5FD" opacity="0.5"/>
    <circle cx="30" cy="132" r="5" fill="#1565C0" opacity="0.3"/>
    <circle cx="55" cy="132" r="5" fill="#1565C0" opacity="0.3"/>
    <circle cx="80" cy="132" r="5" fill="#1565C0" opacity="0.3"/>
    <circle cx="105" cy="132" r="5" fill="#1565C0" opacity="0.3"/>
    <circle cx="130" cy="132" r="5" fill="#1565C0" opacity="0.3"/>

    <text x="82" y="165" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">200+ Patterns</text>
    <text x="82" y="168" font-family="Arial,sans-serif" font-size="0" fill="#9CA3AF" text-anchor="middle">PLR</text>
  </g>

  <!-- Card 4 - Badges/Labels -->
  <g transform="translate(604, 42)" filter="url(#shadow2)">
    <rect width="140" height="175" rx="12" fill="#1A1A4E"/>
    <rect width="140" height="44" rx="12" fill="#1565C0" opacity="0.5"/>
    <rect y="32" width="140" height="12" fill="#1565C0" opacity="0.5"/>
    <text x="70" y="26" font-family="Georgia,serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Badges</text>

    <!-- Badge examples -->
    <polygon points="70,58 84,68 84,86 70,96 56,86 56,68" fill="#1565C0"/>
    <text x="70" y="81" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">NEW</text>

    <circle cx="70" cy="122" r="22" fill="none" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="70" cy="122" r="16" fill="#1565C0" opacity="0.3"/>
    <text x="70" y="127" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">SALE</text>

    <text x="70" y="158" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">100+ Badges</text>
  </g>

  <!-- Bottom panel -->
  <g transform="translate(58, 236)" filter="url(#shadow)">
    <rect width="714" height="195" rx="12" fill="#ffffff"/>
    <rect width="714" height="46" rx="12" fill="#1A1A4E"/>
    <rect y="34" width="714" height="12" fill="#1A1A4E"/>
    <text x="357" y="26" font-family="Georgia,serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Scalable · Editable · Infinitely Versatile</text>

    <!-- Stat columns -->
    <rect x="16" y="60" width="160" height="90" rx="8" fill="#EFF6FF"/>
    <text x="96" y="92" font-family="Arial,sans-serif" font-size="28" fill="#1A1A4E" text-anchor="middle" font-weight="bold">5000+</text>
    <text x="96" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">SVG Files</text>
    <text x="96" y="138" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🎨</text>

    <rect x="192" y="60" width="160" height="90" rx="8" fill="#EFF6FF"/>
    <text x="272" y="92" font-family="Arial,sans-serif" font-size="16" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Infinite</text>
    <text x="272" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Scale Quality</text>
    <text x="272" y="138" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🔍</text>

    <rect x="368" y="60" width="160" height="90" rx="8" fill="#EFF6FF"/>
    <text x="448" y="92" font-family="Arial,sans-serif" font-size="14" fill="#1A1A4E" text-anchor="middle" font-weight="bold">AI · PS · Figma</text>
    <text x="448" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Compatible</text>
    <text x="448" y="138" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🛠️</text>

    <rect x="544" y="60" width="154" height="90" rx="8" fill="#1A1A4E"/>
    <text x="621" y="90" font-family="Arial,sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle" font-weight="bold">Commercial</text>
    <text x="621" y="104" font-family="Arial,sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">Use Ready</text>
    <text x="621" y="118" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.6">Full Resell Rights</text>
    <text x="621" y="138" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">✦</text>
  </g>

  <!-- Label -->
  <text x="400" y="455" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">SVG Designs Bundle</text>
  <rect x="255" y="464" width="290" height="22" rx="11" fill="#ffffff" opacity="0.1"/>
  <text x="400" y="480" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
</svg>
