    <path d="M58,36 Q85,48 112,36" fill="none" stroke="#93C5FD" stroke-width="2"/>
    <!-- Design on shirt -->
    <text x="85" y="85" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">✦</text>
    <text x="85" y="103" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle" font-weight="bold" letter-spacing="2">MINIMAL</text>
