    <rect x="8" y="8" width="154" height="154" rx="8" fill="#1A1A4E"/>
    <!-- T-shirt shape -->
    <path d="M42,28 L30,48 L52,54 L52,130 L118,130 L118,54 L140,48 L128,28 L112,36 Q85,20 58,36 Z" fill="#1565C0"/>
