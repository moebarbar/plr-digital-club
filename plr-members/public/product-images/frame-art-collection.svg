    <rect x="108" y="48" width="70" height="48" rx="4" fill="#1A1A1A"/>
    <rect x="112" y="52" width="62" height="40" rx="2" fill="#F8F6F0"/>
    <rect x="118" y="58" width="50" height="28" rx="1" fill="#EFF6FF"/>
    <text x="143" y="108" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">Modern Black</text>

    <rect x="194" y="44" width="78" height="56" rx="6" fill="#D4AF37"/>
    <rect x="198" y="48" width="70" height="48" rx="4" fill="#B8962E"/>
    <rect x="202" y="52" width="62" height="40" rx="2" fill="#F8F6F0"/>
    <rect x="208" y="58" width="50" height="28" rx="1" fill="#EFF6FF"/>
    <text x="233" y="108" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">Gold Ornate</text>

    <rect x="284" y="44" width="78" height="56" rx="6" fill="#E5E7EB"/>
    <rect x="288" y="48" width="70" height="48" rx="4" fill="#D1D5DB"/>
    <rect x="292" y="52" width="62" height="40" rx="2" fill="#F8F6F0"/>
    <rect x="298" y="58" width="50" height="28" rx="1" fill="#EFF6FF"/>
    <text x="323" y="108" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">White Minimal</text>

