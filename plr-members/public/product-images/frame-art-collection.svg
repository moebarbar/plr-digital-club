<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Samsung Frame TV mockup - main -->
  <g transform="translate(55, 38)" filter="url(#shadow)">
    <rect width="430" height="280" rx="16" fill="#1A1A1A"/>
    <!-- TV bezel -->
    <rect x="8" y="8" width="414" height="255" rx="10" fill="#0D0D0D"/>
    <!-- Screen -->
    <rect x="16" y="16" width="398" height="239" rx="6" fill="#111827"/>
    <!-- Art displayed on frame TV -->
    <rect x="20" y="20" width="390" height="231" rx="4" fill="#1A1A4E"/>
    <!-- Frame around art -->
    <rect x="20" y="20" width="390" height="231" rx="4" fill="none" stroke="#8B7355" stroke-width="6"/>
    <rect x="26" y="26" width="378" height="219" rx="2" fill="none" stroke="#6B5A3E" stroke-width="2"/>
    <!-- Mat board color -->
    <rect x="32" y="32" width="366" height="207" rx="2" fill="#F8F6F0"/>
    <!-- Artwork inside -->
    <rect x="48" y="48" width="334" height="175" rx="2" fill="#EFF6FF"/>
    <!-- Abstract art piece -->
    <circle cx="215" cy="135" r="55" fill="#1565C0" opacity="0.15"/>
    <circle cx="215" cy="135" r="35" fill="#1A1A4E" opacity="0.2"/>
    <!-- Geometric art -->
    <polygon points="215,72 255,150 175,150" fill="#1565C0" opacity="0.2"/>
    <polygon points="215,85 247,148 183,148" fill="#1A1A4E" opacity="0.15"/>
    <circle cx="215" cy="135" r="12" fill="#1565C0" opacity="0.3"/>
    <!-- Botanical silhouette -->
    <path d="M165,198 Q180,160 200,155 Q190,175 215,145 Q225,165 240,155 Q255,160 270,198" fill="none" stroke="#1A1A4E" stroke-width="1.5" opacity="0.3"/>
    <!-- Bottom status bar on TV -->
    <rect x="16" y="248" width="398" height="7" rx="0" fill="#0D0D0D"/>
    <text x="215" y="254" font-family="Arial,sans-serif" font-size="5" fill="#333333" text-anchor="middle">▶  Art Mode · Frame Collection</text>

    <!-- TV stand -->
    <rect x="195" y="271" width="40" height="6" rx="2" fill="#2A2A2A"/>
    <rect x="175" y="277" width="80" height="4" rx="2" fill="#1A1A1A"/>
