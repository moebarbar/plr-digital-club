    <rect width="250" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="250" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="125" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Included</text>

    <text x="24" y="64" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">500+ frame art designs</text>
    <text x="24" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">4K JPEG &amp; PNG files</text>
    <text x="24" y="104" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Samsung Frame TV compatible</text>
    <text x="24" y="124" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Multiple mat board styles</text>
    <text x="24" y="144" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Botanical, abstract, minimal</text>
    <text x="24" y="164" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="42" y="164" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Sell on Etsy · Full PLR rights</text>

    <rect x="18" y="176" width="214" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="125" y="198" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">Digital Download · Resell Rights</text>
