    <text x="396" y="72" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle">+50</text>
    <text x="396" y="84" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">styles</text>
