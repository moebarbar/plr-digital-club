    <rect x="8" y="64" width="35" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
  </g>
  <g transform="translate(525, 308)">
    <rect width="97" height="80" rx="8" fill="#0D47A1" filter="url(#shadow)"/>
    <rect x="8" y="8" width="81" height="40" rx="4" fill="#93C5FD" opacity="0.2"/>
    <text x="48" y="34" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">📱</text>
    <rect x="8" y="56" width="65" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <rect x="8" y="64" width="45" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
  </g>
  <g transform="translate(633, 308)">
    <rect width="97" height="80" rx="8" fill="#1E3A8A" filter="url(#shadow)"/>
    <rect x="8" y="8" width="81" height="40" rx="4" fill="#ffffff" opacity="0.1"/>
    <text x="48" y="34" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">📄</text>
    <rect x="8" y="56" width="50" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <rect x="8" y="64" width="70" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
