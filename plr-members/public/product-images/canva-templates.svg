      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Canva editor mockup -->
  <g transform="translate(65, 55)" filter="url(#shadow)">
    <rect width="430" height="300" rx="12" fill="#ffffff"/>
    <!-- Top chrome -->
    <rect width="430" height="40" rx="12" fill="#F9FAFB"/>
    <rect y="28" width="430" height="12" fill="#F9FAFB"/>
    <rect y="40" width="430" height="1" fill="#E5E7EB"/>
    <circle cx="18" cy="20" r="5" fill="#FF5F57"/>
