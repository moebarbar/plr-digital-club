    <circle cx="50" cy="20" r="5" fill="#28CA41"/>
    <rect x="70" y="12" width="290" height="16" rx="8" fill="#F3F4F6"/>
    <text x="215" y="24" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">canva.com / design</text>

