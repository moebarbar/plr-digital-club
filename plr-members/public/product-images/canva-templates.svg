    <rect x="8" y="8" width="81" height="40" rx="4" fill="#1565C0" opacity="0.5"/>
    <text x="48" y="34" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">📊</text>
    <rect x="8" y="56" width="60" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
    <rect x="8" y="64" width="40" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
  </g>
  <g transform="translate(633, 215)">
