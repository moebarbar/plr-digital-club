    <rect x="8" y="68" width="64" height="44" rx="4" fill="#EFF6FF" stroke="#1565C0" stroke-width="1.5"/>
    <rect x="12" y="72" width="56" height="20" rx="2" fill="#1A1A4E"/>
    <rect x="12" y="96" width="40" height="3" rx="2" fill="#93C5FD"/>
    <rect x="12" y="102" width="30" height="3" rx="2" fill="#93C5FD"/>
    <rect x="8" y="118" width="64" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="12" y="122" width="56" height="20" rx="2" fill="#EFF6FF"/>
    <rect x="12" y="146" width="35" height="3" rx="2" fill="#D1D5DB"/>
    <rect x="12" y="152" width="45" height="3" rx="2" fill="#D1D5DB"/>
    <rect x="8" y="168" width="64" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="12" y="172" width="56" height="20" rx="2" fill="#1565C0" opacity="0.3"/>
    <rect x="12" y="196" width="40" height="3" rx="2" fill="#D1D5DB"/>
    <rect x="8" y="218" width="64" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="12" y="222" width="56" height="20" rx="2" fill="#1A1A4E" opacity="0.2"/>
    <rect x="12" y="246" width="50" height="3" rx="2" fill="#D1D5DB"/>

