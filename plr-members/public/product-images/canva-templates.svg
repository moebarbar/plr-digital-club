    <text x="22" y="92" font-family="Arial,sans-serif" font-size="9" fill="#374151">📄 Documents</text>
    <text x="22" y="108" font-family="Arial,sans-serif" font-size="9" fill="#374151">🎨 Marketing</text>
    <text x="22" y="124" font-family="Arial,sans-serif" font-size="9" fill="#374151">📧 Email Headers</text>
    <text x="130" y="60" font-family="Arial,sans-serif" font-size="8" fill="#1565C0">100+</text>
    <text x="130" y="76" font-family="Arial,sans-serif" font-size="8" fill="#1565C0">250+</text>
    <text x="130" y="92" font-family="Arial,sans-serif" font-size="8" fill="#1565C0">80+</text>
    <text x="130" y="108" font-family="Arial,sans-serif" font-size="8" fill="#1565C0">150+</text>
    <text x="130" y="124" font-family="Arial,sans-serif" font-size="8" fill="#1565C0">60+</text>
