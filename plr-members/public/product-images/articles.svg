<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Blog/article mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="340" height="370" rx="12" fill="#ffffff"/>
    <!-- Header bar -->
    <rect width="340" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="340" height="12" fill="#1A1A4E"/>
    <text x="170" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">PLR Article Library</text>

    <!-- Browser URL bar -->
    <rect x="10" y="52" width="320" height="18" rx="4" fill="#F3F4F6"/>
    <text x="170" y="64" font-family="Arial,sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">yourwebsite.com/blog/article-title</text>

    <!-- Article content -->
    <text x="20" y="94" font-family="Arial,sans-serif" font-size="7" fill="#93C5FD" letter-spacing="1">DIGITAL MARKETING · 5 MIN READ</text>
    <text x="20" y="112" font-family="Georgia,serif" font-size="14" fill="#1A1A4E" font-weight="bold">10 Ways to Boost Your</text>
    <text x="20" y="128" font-family="Georgia,serif" font-size="14" fill="#1A1A4E" font-weight="bold">Online Business in 2026</text>
    <rect x="20" y="136" width="300" height="1" fill="#E5E7EB"/>

    <!-- Author row -->
    <circle cx="34" cy="152" r="10" fill="#1565C0"/>
    <text x="34" y="156" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">J</text>
    <text x="52" y="150" font-family="Arial,sans-serif" font-size="7" fill="#374151" font-weight="bold">Jane Smith</text>
    <text x="52" y="161" font-family="Arial,sans-serif" font-size="6" fill="#9CA3AF">April 2026 · PLR License</text>

    <!-- Article body -->
    <rect x="20" y="174" width="300" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="182" width="280" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="190" width="295" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="198" width="260" height="3" rx="2" fill="#E5E7EB"/>

    <!-- Pullquote block -->
    <rect x="20" y="212" width="300" height="44" rx="4" fill="#EFF6FF"/>
    <rect x="20" y="212" width="4" height="44" rx="2" fill="#1565C0"/>
    <text x="36" y="228" font-family="Georgia,serif" font-size="9" fill="#1A1A4E" font-style="italic">"Content is king, but consistency</text>
    <text x="36" y="240" font-family="Georgia,serif" font-size="9" fill="#1A1A4E" font-style="italic">is the kingdom."</text>
    <text x="36" y="252" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">— PLR Digital Club</text>

    <rect x="20" y="268" width="300" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="276" width="290" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="284" width="270" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="292" width="285" height="3" rx="2" fill="#E5E7EB"/>
    <rect x="20" y="300" width="245" height="3" rx="2" fill="#E5E7EB"/>

    <!-- Tags -->
    <rect x="20" y="316" width="70" height="18" rx="9" fill="#EFF6FF"/>
    <text x="55" y="328" font-family="Arial,sans-serif" font-size="7" fill="#1565C0" text-anchor="middle">#marketing</text>
    <rect x="98" y="316" width="60" height="18" rx="9" fill="#EFF6FF"/>
    <text x="128" y="328" font-family="Arial,sans-serif" font-size="7" fill="#1565C0" text-anchor="middle">#business</text>
    <rect x="166" y="316" width="50" height="18" rx="9" fill="#EFF6FF"/>
    <text x="191" y="328" font-family="Arial,sans-serif" font-size="7" fill="#1565C0" text-anchor="middle">#plr</text>

    <!-- Bottom footer -->
    <rect x="20" y="348" width="300" height="14" rx="4" fill="#1A1A4E" opacity="0.05"/>
    <text x="170" y="358" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">© PLR Digital Club — Fully editable · Commercial Use</text>
  </g>

  <!-- Right panels -->
  <g transform="translate(418, 42)" filter="url(#shadow2)">
    <rect width="330" height="155" rx="12" fill="#ffffff"/>
    <rect width="330" height="44" rx="12" fill="#1565C0"/>
    <rect y="32" width="330" height="12" fill="#1565C0"/>
    <text x="165" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">10 Million+ Articles</text>

    <!-- Category grid -->
    <rect x="14" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="49" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💼</text>
    <text x="49" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Business</text>

    <rect x="92" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="127" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💪</text>
    <text x="127" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Health</text>

    <rect x="170" y="56" width="70" height="40" rx="6" fill="#EFF6FF"/>
    <text x="205" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">💻</text>
    <text x="205" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Technology</text>

    <rect x="248" y="56" width="68" height="40" rx="6" fill="#EFF6FF"/>
    <text x="282" y="72" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🌍</text>
    <text x="282" y="87" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Lifestyle</text>

    <rect x="14" y="108" width="302" height="30" rx="6" fill="#1A1A4E"/>
    <text x="165" y="121" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle" font-weight="bold">Finance · Travel · Fitness · Food · Parenting + More</text>
    <text x="165" y="131" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" opacity="0.6">500+ niche categories covered</text>
  </g>

  <g transform="translate(418, 214)" filter="url(#shadow2)">
    <rect width="330" height="200" rx="12" fill="#1A1A4E"/>
    <rect width="330" height="44" rx="12" fill="#1565C0" opacity="0.4"/>
    <rect y="32" width="330" height="12" fill="#1565C0" opacity="0.4"/>
    <text x="165" y="26" font-family="Georgia,serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">What You Get</text>

    <text x="28" y="64" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">10M+ ready-to-use PLR articles</text>
    <text x="28" y="84" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">500+ niches and industries covered</text>
    <text x="28" y="104" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Edit &amp; publish as your own content</text>
    <text x="28" y="124" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">TXT format — paste into any CMS</text>
    <text x="28" y="144" font-family="Arial,sans-serif" font-size="10" fill="#93C5FD">✓</text>
    <text x="46" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Blog, newsletter &amp; social content</text>

    <rect x="18" y="158" width="294" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="165" y="184" font-family="Arial,sans-serif" font-size="26" fill="#93C5FD" text-anchor="middle" font-weight="bold">10M+</text>
    <text x="165" y="198" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.6">Articles Ready to Use Today</text>
  </g>

  <!-- Label -->
  <text x="400" y="452" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Articles</text>
  <text x="400" y="474" font-family="Arial,sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">10 Million+ PLR Articles · 500+ Niches</text>
  <rect x="275" y="482" width="250" height="14" rx="7" fill="#ffffff" opacity="0.1"/>
</svg>
