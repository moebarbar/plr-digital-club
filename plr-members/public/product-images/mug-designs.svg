<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Mug 1 - Navy with monogram -->
  <g transform="translate(62, 60)" filter="url(#shadow)">
    <rect width="175" height="200" rx="12" fill="#ffffff"/>
    <rect x="10" y="10" width="155" height="155" rx="8" fill="#1A1A4E"/>
    <!-- Mug body -->
    <rect x="30" y="28" width="88" height="110" rx="8" fill="#1565C0"/>
    <!-- Mug handle -->
    <path d="M118,55 Q148,55 148,83 Q148,111 118,111" fill="none" stroke="#1565C0" stroke-width="12" stroke-linecap="round"/>
    <path d="M118,55 Q142,55 142,83 Q142,111 118,111" fill="none" stroke="#1A1A4E" stroke-width="6" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M55,22 Q58,14 55,6" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M74,22 Q77,12 74,2" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- Design on mug -->
    <text x="74" y="78" font-family="Georgia,serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">M</text>
    <rect x="36" y="108" width="76" height="2" fill="#93C5FD" opacity="0.5"/>
    <text x="74" y="122" font-family="Arial,sans-serif" font-size="7" fill="#EFF6FF" text-anchor="middle" letter-spacing="2">MONOGRAM</text>
    <!-- Mug base shadow -->
    <ellipse cx="74" cy="138" rx="44" ry="5" fill="#0D47A1" opacity="0.4"/>
    <text x="87" y="180" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Monogram Style</text>
    <text x="87" y="193" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR · Resell Rights</text>
  </g>

  <!-- Mug 2 - White with quote -->
  <g transform="translate(253, 60)" filter="url(#shadow)">
    <rect width="175" height="200" rx="12" fill="#ffffff"/>
    <rect x="10" y="10" width="155" height="155" rx="8" fill="#EFF6FF"/>
    <!-- Mug body -->
    <rect x="28" y="28" width="90" height="110" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M118,55 Q148,55 148,83 Q148,111 118,111" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
    <path d="M118,55 Q142,55 142,83 Q142,111 118,111" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M55,22 Q58,14 55,6" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M73,22 Q76,12 73,2" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Quote design -->
    <text x="73" y="65" font-family="Georgia,serif" font-size="24" fill="#1565C0" text-anchor="middle">"</text>
    <text x="73" y="82" font-family="Georgia,serif" font-size="9" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Good Vibes</text>
    <text x="73" y="94" font-family="Georgia,serif" font-size="9" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Only</text>
    <text x="73" y="108" font-family="Georgia,serif" font-size="24" fill="#1565C0" text-anchor="middle">"</text>
    <ellipse cx="73" cy="138" rx="45" ry="5" fill="#D1D5DB" opacity="0.4"/>
    <text x="87" y="180" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Quote Style</text>
    <text x="87" y="193" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR · Resell Rights</text>
  </g>

  <!-- Mug 3 - Dark minimal -->
  <g transform="translate(444, 60)" filter="url(#shadow)">
    <rect width="175" height="200" rx="12" fill="#ffffff"/>
    <rect x="10" y="10" width="155" height="155" rx="8" fill="#0D1B3E"/>
    <!-- Mug -->
    <rect x="28" y="28" width="90" height="110" rx="8" fill="#1A1A4E"/>
    <path d="M118,55 Q148,55 148,83 Q148,111 118,111" fill="none" stroke="#1A1A4E" stroke-width="12" stroke-linecap="round"/>
    <path d="M118,55 Q142,55 142,83 Q142,111 118,111" fill="none" stroke="#0D1B3E" stroke-width="6" stroke-linecap="round"/>
    <path d="M55,22 Q58,14 55,6" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M73,22 Q76,12 73,2" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Geometric design -->
    <circle cx="73" cy="80" r="22" fill="none" stroke="#1565C0" stroke-width="1.5"/>
    <circle cx="73" cy="80" r="14" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.6"/>
    <circle cx="73" cy="80" r="5" fill="#1565C0"/>
    <rect x="51" y="79" width="44" height="1" fill="#1565C0" opacity="0.4"/>
    <rect x="72" y="58" width="1" height="44" fill="#1565C0" opacity="0.4"/>
    <ellipse cx="73" cy="138" rx="45" ry="5" fill="#060E24" opacity="0.5"/>
    <text x="87" y="180" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Geometric Style</text>
    <text x="87" y="193" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR · Resell Rights</text>
  </g>

  <!-- Mug 4 small -->
  <g transform="translate(635, 60)" filter="url(#shadow2)">
    <rect width="140" height="200" rx="12" fill="#ffffff"/>
    <rect x="10" y="10" width="120" height="155" rx="8" fill="#1565C0" opacity="0.15"/>
    <rect x="24" y="28" width="72" height="96" rx="6" fill="#1565C0"/>
    <path d="M96,50 Q118,50 118,74 Q118,98 96,98" fill="none" stroke="#1565C0" stroke-width="10" stroke-linecap="round"/>
    <path d="M96,50 Q112,50 112,74 Q112,98 96,98" fill="none" stroke="#EFF6FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M46,22 Q48,15 46,8" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M60,22 Q62,13 60,4" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <text x="60" y="78" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#ffffff">☕</text>
    <ellipse cx="60" cy="124" rx="36" ry="4" fill="#1565C0" opacity="0.2"/>
    <text x="70" y="180" font-family="Arial,sans-serif" font-size="8" fill="#6B7280" text-anchor="middle">Fun Series</text>
    <text x="70" y="193" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="middle">PLR Rights</text>
  </g>

  <!-- Bottom info bar -->
  <g transform="translate(62, 278)" filter="url(#shadow)">
    <rect width="714" height="168" rx="12" fill="#ffffff"/>
    <rect width="714" height="46" rx="12" fill="#1A1A4E"/>
    <rect y="34" width="714" height="12" fill="#1A1A4E"/>
    <text x="357" y="26" font-family="Georgia,serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Print-On-Demand Ready · Sell Anywhere</text>

    <!-- 4 stat columns -->
    <rect x="16" y="60" width="160" height="92" rx="8" fill="#EFF6FF"/>
    <text x="96" y="92" font-family="Arial,sans-serif" font-size="28" fill="#1A1A4E" text-anchor="middle" font-weight="bold">100+</text>
    <text x="96" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Unique Designs</text>
    <text x="96" y="140" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🎨</text>

    <rect x="192" y="60" width="160" height="92" rx="8" fill="#EFF6FF"/>
    <text x="272" y="92" font-family="Arial,sans-serif" font-size="28" fill="#1A1A4E" text-anchor="middle" font-weight="bold">300</text>
    <text x="272" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">DPI High Res</text>
    <text x="272" y="140" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🖨️</text>

    <rect x="368" y="60" width="160" height="92" rx="8" fill="#EFF6FF"/>
    <text x="448" y="92" font-family="Arial,sans-serif" font-size="16" fill="#1A1A4E" text-anchor="middle" font-weight="bold">PNG · PSD</text>
    <text x="448" y="108" font-family="Arial,sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Transparent BG</text>
    <text x="448" y="140" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">📁</text>

    <rect x="544" y="60" width="154" height="92" rx="8" fill="#1A1A4E"/>
    <text x="621" y="92" font-family="Arial,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" font-weight="bold">Etsy · Amazon</text>
    <text x="621" y="106" font-family="Arial,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle">Printful · POD</text>
    <text x="621" y="120" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" opacity="0.6">Sell on any platform</text>
    <text x="621" y="140" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">🛒</text>
  </g>

  <!-- Label -->
  <text x="400" y="463" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Mug Designs</text>
  <text x="400" y="484" font-family="Arial,sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">Print-Ready · POD · Full Resell Rights</text>
</svg>
