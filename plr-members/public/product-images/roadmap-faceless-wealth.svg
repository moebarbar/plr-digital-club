    <rect y="32" width="210" height="12" fill="#7C3AED" opacity="0.35"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">What's Inside</text>

    <text x="22" y="64" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="64" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Step-by-step roadmap</text>
    <text x="22" y="84" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="84" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Niche selection guide</text>
    <text x="22" y="104" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="104" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Anonymous brand strategy</text>
    <text x="22" y="124" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="124" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">Monetization blueprints</text>
    <text x="22" y="144" font-family="Arial,sans-serif" font-size="10" fill="#C4B5FD">✓</text>
    <text x="40" y="144" font-family="Arial,sans-serif" font-size="9" fill="#ffffff">AI tools &amp; automation tips</text>

