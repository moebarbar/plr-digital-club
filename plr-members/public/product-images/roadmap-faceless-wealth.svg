    <text x="96" y="166" font-family="Arial,sans-serif" font-size="9" fill="#C4B5FD" font-weight="bold">Create &amp; Automate Content</text>
    <text x="96" y="178" font-family="Arial,sans-serif" font-size="7.5" fill="#9CA3AF">Scale with faceless videos, posts &amp; digital products</text>

