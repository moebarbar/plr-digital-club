<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A4E"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="720" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="80" cy="430" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Video editor mockup -->
  <g transform="translate(55, 42)" filter="url(#shadow)">
    <rect width="470" height="330" rx="12" fill="#0D1117"/>
    <!-- Top bar -->
    <rect width="470" height="36" rx="12" fill="#161B22"/>
    <rect y="24" width="470" height="12" fill="#161B22"/>
    <circle cx="18" cy="18" r="5" fill="#FF5F57"/>
    <circle cx="34" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="18" r="5" fill="#28CA41"/>
    <text x="235" y="23" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Video Editor Pro — project.mp4</text>

    <!-- Preview area -->
    <rect x="8" y="44" width="310" height="175" rx="4" fill="#000000"/>
    <rect x="8" y="44" width="310" height="175" rx="4" fill="#1A1A4E" opacity="0.6"/>
    <!-- Video frame content -->
    <text x="163" y="130" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#93C5FD" opacity="0.4">▶</text>
    <!-- Lower third overlay -->
    <rect x="18" y="192" width="200" height="20" rx="2" fill="#1565C0" opacity="0.85"/>
    <text x="26" y="205" font-family="Arial,sans-serif" font-size="7" fill="#ffffff" font-weight="bold">John Smith · CEO</text>
    <!-- Timecode -->
    <text x="305" y="207" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF" text-anchor="end">00:01:24:08</text>

    <!-- Right panel - assets -->
    <rect x="326" y="44" width="136" height="175" rx="4" fill="#161B22"/>
    <text x="394" y="62" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle" font-weight="bold">Asset Library</text>
    <!-- Asset items -->
    <rect x="334" y="70" width="120" height="28" rx="3" fill="#1A1A4E"/>
    <text x="344" y="82" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD">▶</text>
    <text x="358" y="82" font-family="Arial,sans-serif" font-size="7" fill="#ffffff">Intro Titles</text>
    <text x="358" y="92" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">24 clips</text>

    <rect x="334" y="102" width="120" height="28" rx="3" fill="#1565C0" opacity="0.3"/>
    <text x="344" y="114" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD">✦</text>
    <text x="358" y="114" font-family="Arial,sans-serif" font-size="7" fill="#ffffff">Transitions</text>
    <text x="358" y="124" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">80 effects</text>

    <rect x="334" y="134" width="120" height="28" rx="3" fill="#1A1A4E"/>
    <text x="344" y="146" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD">🎵</text>
    <text x="358" y="146" font-family="Arial,sans-serif" font-size="7" fill="#ffffff">Music Tracks</text>
    <text x="358" y="156" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">150 tracks</text>

    <rect x="334" y="166" width="120" height="28" rx="3" fill="#1A1A4E"/>
    <text x="344" y="178" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD">⚡</text>
    <text x="358" y="178" font-family="Arial,sans-serif" font-size="7" fill="#ffffff">SFX Library</text>
    <text x="358" y="188" font-family="Arial,sans-serif" font-size="6" fill="#6B7280">500 sounds</text>

    <!-- Timeline -->
    <rect x="8" y="228" width="454" height="90" rx="4" fill="#161B22"/>
    <text x="24" y="244" font-family="Arial,sans-serif" font-size="7" fill="#6B7280">TIMELINE</text>
    <!-- Timeline tracks -->
    <rect x="8" y="250" width="60" height="60" rx="0" fill="#1A1A4E"/>
    <text x="38" y="272" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Video 1</text>
    <text x="38" y="282" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Audio 1</text>
    <text x="38" y="292" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">Titles</text>
    <text x="38" y="302" font-family="Arial,sans-serif" font-size="6" fill="#6B7280" text-anchor="middle">SFX</text>

    <!-- Track clips -->
    <rect x="70" y="252" width="100" height="13" rx="2" fill="#1565C0" opacity="0.7"/>
    <rect x="175" y="252" width="80" height="13" rx="2" fill="#1565C0" opacity="0.5"/>
    <rect x="260" y="252" width="120" height="13" rx="2" fill="#1565C0" opacity="0.7"/>
    <rect x="70" y="269" width="60" height="13" rx="2" fill="#093C7A" opacity="0.8"/>
    <rect x="136" y="269" width="100" height="13" rx="2" fill="#093C7A" opacity="0.6"/>
    <rect x="70" y="286" width="50" height="13" rx="2" fill="#1A1A4E" opacity="0.8"/>
    <rect x="126" y="286" width="30" height="13" rx="2" fill="#1A1A4E" opacity="0.8"/>
    <rect x="70" y="303" width="30" height="13" rx="2" fill="#0D2B4E" opacity="0.8"/>
    <rect x="106" y="303" width="20" height="13" rx="2" fill="#0D2B4E" opacity="0.8"/>

    <!-- Playhead -->
    <rect x="200" y="228" width="1" height="90" fill="#93C5FD" opacity="0.8"/>
    <polygon points="197,228 203,228 200,235" fill="#93C5FD" opacity="0.8"/>
  </g>

  <!-- Right info panels -->
  <g transform="translate(546, 42)" filter="url(#shadow2)">
    <rect width="210" height="155" rx="12" fill="#ffffff"/>
    <rect width="210" height="44" rx="12" fill="#1A1A4E"/>
    <rect y="32" width="210" height="12" fill="#1A1A4E"/>
    <text x="105" y="26" font-family="Georgia,serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Asset Types</text>

    <rect x="14" y="56" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="57" y="75" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🎬</text>
    <text x="57" y="91" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Stock Footage</text>

    <rect x="110" y="56" width="86" height="44" rx="6" fill="#EFF6FF"/>
    <text x="153" y="75" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">🎵</text>
    <text x="153" y="91" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">Music &amp; SFX</text>

    <rect x="14" y="106" width="86" height="36" rx="6" fill="#EFF6FF"/>
    <text x="57" y="129" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">⚡ Transitions</text>

    <rect x="110" y="106" width="86" height="36" rx="6" fill="#EFF6FF"/>
    <text x="153" y="129" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle" font-weight="bold">📝 Title Cards</text>
  </g>

  <g transform="translate(546, 214)" filter="url(#shadow2)">
    <rect width="210" height="160" rx="12" fill="#1565C0" opacity="0.15"/>
    <rect width="210" height="160" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <text x="105" y="28" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">Compatible With</text>
    <rect x="20" y="36" width="170" height="1" fill="#ffffff" opacity="0.15"/>
    <text x="30" y="58" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🎬 Adobe Premiere Pro</text>
    <text x="30" y="78" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✂️ Final Cut Pro</text>
    <text x="30" y="98" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">🎨 DaVinci Resolve</text>
    <text x="30" y="118" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">📱 CapCut &amp; Mobile</text>
    <rect x="20" y="130" width="170" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="105" y="150" font-family="Arial,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" opacity="0.7">Full Resell Rights Included</text>
  </g>
</svg>
