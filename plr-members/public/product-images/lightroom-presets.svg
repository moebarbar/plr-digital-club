    <text x="139" y="126" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">🌿</text>
    <text x="139" y="141" font-family="Arial,sans-serif" font-size="7" fill="#1A1A4E" text-anchor="middle">Nature</text>
