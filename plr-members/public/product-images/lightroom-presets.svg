    <text x="24" y="64" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✓</text>
    <text x="40" y="64" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">Lightroom Classic</text>
    <text x="24" y="84" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✓</text>
    <text x="40" y="84" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">Lightroom CC &amp; Mobile</text>
    <text x="24" y="104" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✓</text>
    <text x="40" y="104" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">Camera Raw (PS)</text>
    <text x="24" y="124" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✓</text>
    <text x="40" y="124" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">XMP files included</text>
    <text x="24" y="144" font-family="Arial,sans-serif" font-size="9" fill="#93C5FD">✓</text>
    <text x="40" y="144" font-family="Arial,sans-serif" font-size="8" fill="#ffffff">One-click application</text>

    <rect x="16" y="154" width="158" height="1" fill="#ffffff" opacity="0.1"/>
    <text x="95" y="172" font-family="Arial,sans-serif" font-size="8" fill="#93C5FD" text-anchor="middle">.XMP · .LRTEMPLATE · PLR</text>
