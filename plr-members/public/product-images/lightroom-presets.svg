  <!-- Label -->
  <text x="308" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Lightroom Presets</text>
  <text x="308" y="454" font-family="Arial,sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">1000+ Presets · Cinematic · Portrait · Landscape</text>
  <rect x="172" y="466" width="272" height="22" rx="11" fill="#ffffff" opacity="0.1"/>
  <text x="308" y="482" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✦ PLR Digital Club</text>
